<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Press Game (Reels)</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:-apple-system, "Noto Sans KR", sans-serif; }
  canvas { display:block; background:#000; }
  #ui { position:fixed; top:12px; right:12px; display:flex; gap:8px; z-index:10; flex-wrap:wrap; justify-content:flex-end; }
  #ui button, #ui select {
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:20px; padding:8px 14px; font-size:14px; cursor:pointer; backdrop-filter:blur(6px);
  }
  #ui button.rec { background:#e0245e; border-color:#e0245e; }
  #ui label { display:flex; align-items:center; gap:8px; color:#fff; font-size:14px; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:6px 14px; backdrop-filter:blur(6px); }
  #ui input[type=range] { width:110px; accent-color:#ffd0e0; }
  #hint { position:fixed; bottom:10px; left:0; right:0; padding:0 14px; line-height:1.6; text-align:center; color:rgba(255,255,255,.35); font-size:12px; z-index:10; pointer-events:none; }
  #audioHint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3); border-radius:30px; padding:12px 22px; font-size:15px; z-index:20; pointer-events:none; backdrop-filter:blur(6px); }
  #savePanel { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; backdrop-filter:blur(8px); }
  #savePanel video { width:min(52vw, 260px); aspect-ratio:9/16; border-radius:16px; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #savePanel button { border:0; border-radius:28px; padding:16px 28px; font-size:18px; font-weight:700; cursor:pointer; }
  #btnSave { background:#3d7bff; color:#fff; min-width:240px; }
  #btnAgain { background:rgba(255,255,255,.15); color:#fff; }
  #btnClose { background:transparent; color:rgba(255,255,255,.6); font-size:14px; font-weight:400; }
  #saveMsg { color:rgba(255,255,255,.7); font-size:13px; text-align:center; max-width:80vw; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <select id="modeSel" title="게임 모드"><option value="merge">합치기 게임</option><option value="press">프레스 게임</option></select>
  <select id="presetSel"></select>
  <button id="btnPause">⏸ 일시정지</button>
  <button id="btnReset">다시 시작</button>
  <button id="btnRec">● 녹화</button>
  <label title="누르는 주기 (ms): 한 번 눌렀다 열리기까지 걸리는 시간">주기 <input id="cycle" type="range" min="400" max="2000" step="20"><span id="cycleVal"></span></label>
  <label title="압착기가 벌어지는 너비의 절반 (px). 넓을수록 한 번에 많이 뭅니다">벌림 <input id="openw" type="range" min="60" max="280" step="5"><span id="openwVal"></span></label>
  <label title="하나가 터지면 몇 개가 되는지. 클수록 훨씬 빨리 불어납니다">배수 <input id="mult" type="range" min="2" max="6" step="1"><span id="multVal"></span></label>
  <label title="눌렸을 때 세로가 원래의 몇 배까지 늘어나는지. 가로는 그만큼 줄어듭니다">늘림 <input id="stretch" type="range" min="1" max="3" step="0.05"><span id="stretchVal"></span></label>
  <label title="공 크기 (px)">공 <input id="ballr" type="range" min="10" max="40" step="1"><span id="ballrVal"></span></label>
  <label title="몇 개가 되면 끝낼지">끝 <input id="goal" type="range" min="200" max="2500" step="50"><span id="goalVal"></span></label>
  <button id="btnHide">UI 숨기기</button>
</div>
<div id="savePanel" class="hidden">
  <video id="savePreview" playsinline muted autoplay loop></video>
  <button id="btnSave">📲 사진 앨범에 저장</button>
  <div id="saveMsg">아이폰: 공유 시트가 뜨면 "비디오 저장"을 누르세요</div>
  <button id="btnAgain">● 다시 녹화</button>
  <button id="btnClose">닫기</button>
</div>
<div id="audioHint">🔈 화면을 한 번 탭하면 소리가 켜집니다</div>
<div id="hint">스페이스/P: 일시정지 · H: UI 숨기기/보이기 · R: 녹화 · Enter: 다시 시작 · 화면을 탭하면 숨긴 UI 가 다시 나옵니다 (UI 는 녹화에 안 담깁니다) · 모드: UI 왼쪽 위에서 합치기 게임으로 바꿀 수 있습니다 · URL ?preset=fruits &open=150 &mult=2 &stretch=1.85 &cycle=700 &ball=20 &goal=460 &ui=0</div>

<script src="presets.js"></script>
<script>
/* ============================================================
   프레스 모드: 가운데 압착기가 공을 누르면 터지면서 두 개가 된다.
   공이 늘어나는 만큼 원이 커지고, 목표 개수에 닿으면 전부 터뜨리며 끝난다.
   머지 게임(index.html)과는 다른 규칙이라 파일을 따로 두었다.
   녹화는 tools/record.js 를 GAME_URL=http://localhost:8765/press.html 로 돌리면 된다.
   ============================================================ */

/* ▼▼▼ 설정 ▼▼▼ */
const SETTINGS = {
  preset: "fruits",      // 공에 쓸 그림 프리셋 (presets.js 의 이름). "none" 이면 단색 공
  ballR: 20,             // 공 반지름 (px). 작을수록 압착기 입에 한 번에 더 많이 들어간다
  startR: 330,           // 처음 원 반지름. 틀 모서리와 원 사이로 공이 넉넉히 돌아다닐 만큼은 띄워야
                         // 구석에 끼지 않는다 (공 지름의 두 배 이상)
  goal: 460,             // 이만큼 되면 피날레
  pack: 0.80,            // 원 넓이 대비 공이 차지할 비율. 빽빽할수록 압착기 입이 늘 꽉 차서 빨리 불어난다
  mult: 2,               // 하나가 터지면 몇 개가 되는지 (2~6). 클수록 훨씬 빨리 불어난다
  stretch: 1.85,         // 눌렸을 때 세로가 원래의 몇 배까지 늘어나는지 (1~3). 가로는 그만큼 줄어든다
  openW: 150,            // 압착기가 벌어지는 너비의 절반 (px, 60~280). 보이는 크기를 정한다.
                         // 넓혀도 걸리는 시간은 거의 그대로다 (80·150·240 에서 37.4 / 36.7 / 37.9초)
  cycleMs: 700,          // 한 번 눌렀다 열리기까지. 이 중 55%가 지긋이 밀고 들어가는 시간
  restitution: 0.86,     // 공끼리 튀는 정도
  wallBounce: 0.88,      // 원 벽에 튀는 정도
  soundVolume: 0.8,
  bgColor: "#000000",
  ringColors: ["#ffffff", "#dfe6ff"],
};
/* ▲▲▲ 설정 끝 ▲▲▲ */

const W = 1080, H = 1920;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = W; canvas.height = H;
const params = new URLSearchParams(location.search);
{ const v = parseFloat(params.get("cycle")); if (!isNaN(v)) SETTINGS.cycleMs = Math.min(2000, Math.max(400, v)); }
{ const v = parseFloat(params.get("ball"));  if (!isNaN(v)) SETTINGS.ballR   = Math.min(40, Math.max(10, v)); }
{ const v = parseFloat(params.get("goal"));  if (!isNaN(v)) SETTINGS.goal    = Math.min(2500, Math.max(50, v)); }
{ const v = parseFloat(params.get("open"));  if (!isNaN(v)) SETTINGS.openW   = Math.min(280, Math.max(60, v)); }
{ const v = parseFloat(params.get("stretch")); if (!isNaN(v)) SETTINGS.stretch = Math.min(3, Math.max(1, v)); }
{ const v = parseFloat(params.get("mult")); if (!isNaN(v)) SETTINGS.mult = Math.min(6, Math.max(2, Math.round(v))); }
{ const v = params.get("preset"); if (v) SETTINGS.preset = v; }

/* ---------- 요소 그림: 머지 게임과 같은 presets.js 를 쓴다 ---------- */
// 목표까지의 진행도를 따라 다음 단계 그림으로 넘어간다. 프리셋이 없으면 단색 공으로 그린다
let presetName = (typeof PRESETS !== "undefined" && PRESETS[SETTINGS.preset]) ? SETTINGS.preset : null;
let ITEMS = presetName ? PRESETS[presetName].items : [];
const imgCache = {}, spriteCache = [];
function kitUrls(name) {
  const kit = (typeof KITS !== "undefined" && KITS[PRESETS[presetName].kit]) || [];
  return kit.map(b => b + name.split("/").map(encodeURIComponent).join("/"));
}
function imageCandidates(t) { return t.image ? [t.image] : t.img ? kitUrls(t.img) : []; }
function loadImages() {
  const jobs = [];
  for (const t of ITEMS) {
    const cands = imageCandidates(t); if (!cands.length) continue;
    const key = cands[0]; t._imgKey = key;
    if (imgCache[key] !== undefined) continue;
    jobs.push(new Promise(res => {
      let i = 0;
      const tryNext = () => {
        if (i >= cands.length) { imgCache[key] = null; res(); return; }
        const im = new Image(); im.crossOrigin = "anonymous";
        im.onload = () => { imgCache[key] = im; res(); };
        im.onerror = () => { i++; tryNext(); };
        im.src = cands[i];
      };
      tryNext();
    }));
  }
  return Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 6000))])
    .then(() => { spriteCache.length = 0; for (let i = 0; i < ITEMS.length; i++) itemSprite(i); });   // 미리 구워 둔다
}
// 공 하나 크기로 미리 그려 둔 그림. 수백 개를 매 프레임 그려야 해서 그때그때 만들면 안 된다
function itemSprite(i) {
  if (spriteCache[i]) return spriteCache[i];
  const t = ITEMS[i % ITEMS.length], r = SETTINGS.ballR, pad = Math.ceil(r*0.5), S = Math.ceil(r*2 + pad*2);
  const c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d");
  const im = t._imgKey && imgCache[t._imgKey];
  if (im) {                                                     // 키트 PNG
    const d = r*2*(t.scale || 1.12);
    if (t.glow) { g.save(); g.shadowColor = t.glow; g.shadowBlur = r*0.55; g.drawImage(im, S/2-d/2, S/2-d/2, d, d); g.restore(); }
    g.drawImage(im, S/2-d/2, S/2-d/2, d, d);
  } else if (t.emoji) {                                         // 이모지로 그리는 요소
    g.font = `${Math.round(r*1.6)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.save(); g.shadowColor = t.glow || "#fff"; g.shadowBlur = r*0.6; g.fillText(t.emoji, S/2, S/2 + r*0.08); g.restore();
    g.fillText(t.emoji, S/2, S/2 + r*0.08);
  } else if (typeof SHAPES !== "undefined" && (t.shape || t.colors)) {
    // 코드로 그리는 요소 (블랙홀·보석·행성 등). 머지 게임과 같은 SHAPES 를 쓴다.
    // 머지 게임은 base 층과 light 층을 따로 두지만 여기 공은 돌지 않으므로 한 장에 겹쳐 굽는다
    g.save(); g.translate(S/2, S/2);
    if (t.shape !== "blackhole") {                              // 바깥으로 퍼지는 빛 (블랙홀은 빛을 내지 않는다)
      const soft = t.shape === "star" || t.shape === "sun";
      g.save(); g.shadowColor = t.glow || "#fff"; g.shadowBlur = pad*1.6; g.fillStyle = t.glow || "#fff";
      g.beginPath(); g.arc(0, 0, r*(soft ? 0.72 : 0.92), 0, Math.PI*2);
      g.globalAlpha = soft ? 0.5 : 0.85; g.fill(); g.shadowBlur = pad*0.7; g.fill(); g.restore();
    }
    const draw = SHAPES[t.shape] || SHAPES.sphere;
    LIGHT_PASS = false; draw(g, r, t);
    LIGHT_PASS = true;  draw(g, r, t);
    LIGHT_PASS = false;
    g.restore();
  } else {
    g.fillStyle = t.glow || "#fff"; g.beginPath(); g.arc(S/2, S/2, r, 0, Math.PI*2); g.fill();
  }
  return spriteCache[i] = c;
}
function itemColor(g) { return ITEMS.length ? (ITEMS[g % ITEMS.length].glow || PALETTE[g % PALETTE.length]) : PALETTE[g % PALETTE.length]; }

// 압착기 생김새: 네모 틀. 양옆 벽이 가운데로 미끄러져 들어오고, 위아래 막대는 가운데만 막아 네 귀퉁이가 뚫려 있다
const PRESS = { cy: H/2, halfH: 142, wall: 22, openHalf: SETTINGS.openW, closeHalf: 22, brkFrac: 0.30, plate: 8 };
const ARENA = { cx: W/2, cy: H/2, R: SETTINGS.startR };
// 틀 모서리와 원 벽 사이에 공이 넉넉히 지나갈 틈(공 지름의 두 배)이 남는 최소 반지름
function minArenaR() { return Math.hypot(PRESS.openHalf, PRESS.halfH) + SETTINGS.ballR*2 + 20; }
function baseArenaR() { return Math.max(SETTINGS.startR, minArenaR()); }
const RAIL_H = 26;

// 세대마다 색이 바뀐다. 눌릴 때마다 다음 색으로 넘어가서 화면 색이 통째로 갈아엎어진다
const PALETTE = ["#ff8a1e", "#2eff6a", "#3d7bff", "#ff2e78", "#ffe03d", "#22d7ff", "#b44dff", "#ff3b2e", "#8cff2e", "#ff6ad5"];

let balls = [], particles = [], goo = [], confetti = [], crushing = [];
let uid = 0, peak = 0, stage = 0;   // stage: 지금 내보내는 요소 단계 (뒤로는 안 간다)
let gt = 0, paused = true, ended = false, endedAt = 0, overSince = 0;   // overSince 는 record.js 호환용 (이 모드엔 게임 오버가 없다)
let shake = 0, flash = 0, pressT = 0, cycleId = 0;
let TIERS = [];                                                         // record.js 호환용 빈 값 (imgCache 는 위에 있다)
let ringCanvas = null, ringCanvasR = -1;

function reset() {
  balls = []; particles = []; goo = []; confetti = []; crushing = [];
  uid = 0; peak = 0; stage = 0; ended = false; endedAt = 0; overSince = 0;
  shake = 0; flash = 0; pressT = 0; cycleId = 0;
  ARENA.R = baseArenaR(); ringCanvasR = -1;
  spawn(ARENA.cx, ARENA.cy + 6, (Math.random()-.5)*160, (Math.random()-.5)*160);   // 첫 공은 압착기 안에서 시작
}
function spawn(x, y, vx, vy, safeMs = 0) {
  balls.push({ id: uid++, x, y, vx, vy, r: SETTINGS.ballR, gen: stage, color: itemColor(stage), safe: gt + safeMs, pop: 0 });
}
// 지금 몇 단계짜리 요소를 내보낼지. 목표까지 얼마나 왔느냐로 정해서, 목표에 닿을 때 마지막 단계(우주라면 블랙홀)가 되게 한다.
// 개수는 기하급수로 늘기 때문에 진행도를 그대로 쓰면 1단계에 한참 머물다 뒷단계가 몰린다. 0.45 제곱으로 펴 준다
function stageNow() {
  const last = (ITEMS.length || PALETTE.length) - 1;
  const p = Math.pow(Math.min(1, Math.max(1, balls.length) / SETTINGS.goal), 0.45);
  return Math.max(0, Math.min(last, Math.floor(p * (last + 1))));
}

/* ---------- 소리 ---------- */
let actx = null, master = null, recDest = null, noiseBuf = null;
let tapAt = 0, tapCount = 0;
function initAudio() {
  if (actx) { if (actx.state !== "running") actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = SETTINGS.soundVolume;
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 6;
  master.connect(comp); comp.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); comp.connect(recDest);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  actx.resume();
  document.getElementById("audioHint").classList.add("hidden");
}
function tone({ type="sine", f0, f1, a=0.005, d=0.3, vol=0.2, at=0 }) {
  if (!actx) return;
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + a + d + 0.05);
}
function noise({ type="bandpass", f0, f1, q=1, a=0.002, d=0.1, vol=0.2, at=0 }) {
  if (!actx) return;
  const t = actx.currentTime + at, src = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f0, t);
  if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  src.connect(fl); fl.connect(g); g.connect(master);
  src.start(t, Math.random()*0.5); src.stop(t + a + d + 0.05);
}
const SFX = {
  ready() { return actx && actx.state === "running" && SETTINGS.soundVolume > 0; },
  servo(dur) {                                           // 지긋이 밀고 들어가는 동안 계속 나는 유압 소리
    if (!this.ready()) return;
    const d = Math.max(0.15, dur || 0.26);
    noise({ type: "bandpass", f0: 300, f1: 1400, q: 1.5, a: d*0.3, d: d, vol: 0.08 });
    tone({ type: "sawtooth", f0: 54, f1: 98, a: d*0.3, d: d, vol: 0.055 });
  },
  clank() {                                              // 다 닫힐 때 쇠끼리 부딪히는 소리
    if (!this.ready()) return;
    noise({ type: "highpass", f0: 2600, f1: 1100, q: 0.8, a: 0.001, d: 0.09, vol: 0.20 });
    noise({ type: "lowpass",  f0: 420,  f1: 120,  q: 0.7, a: 0.001, d: 0.14, vol: 0.24 });
    tone({ type: "triangle", f0: 168, f1: 74, a: 0.001, d: 0.17, vol: 0.13 });
  },
  strain(n) {                                            // 압착판에 눌려 버티는 동안 나는 삐걱 소리
    if (!this.ready()) return;
    const k = Math.min(1, Math.log2(1 + n) / 6);
    tone({ type: "sawtooth", f0: 62, f1: 128 + k*90, a: 0.06, d: 0.42, vol: 0.05 + k*0.05 });
    noise({ type: "bandpass", f0: 220, f1: 900 + k*700, q: 6, a: 0.05, d: 0.40, vol: 0.05 + k*0.05 });
    for (let i = 0; i < 4; i++)                          // 삐걱삐걱 끊기는 결
      noise({ at: 0.08 + i*0.085, type: "bandpass", f0: 700 + i*420, q: 9, a: 0.004, d: 0.05, vol: 0.05 });
  },
  pop(n) {                                               // 터지는 소리. 한꺼번에 여러 개가 터질수록 두껍게
    if (!this.ready()) return;
    const k = Math.min(1, Math.log2(1 + n) / 6);
    noise({ type: "lowpass",  f0: 900 - k*380, f1: 180, q: 0.7, a: 0.001, d: 0.09 + k*0.13, vol: 0.20 + k*0.26 });
    noise({ type: "bandpass", f0: 1500, f1: 4200 + k*2600, q: 0.9, a: 0.002, d: 0.10 + k*0.10, vol: 0.13 + k*0.16 });
    tone({ type: "sine", f0: 300 - k*120, f1: 90, a: 0.001, d: 0.12 + k*0.10, vol: 0.10 + k*0.12 });
    for (let i = 0; i < Math.min(5, Math.round(n/3)); i++)
      noise({ at: 0.02 + i*0.035, type: "bandpass", f0: 1100 + Math.random()*2200, q: 2, a: 0.001, d: 0.04, vol: 0.09 });
  },
  tap(sp) {                                              // 공끼리 부딪히는 소리. 초당 몇 번으로 막아 둔다
    if (!this.ready()) return;
    if (gt - tapAt > 100) { tapAt = gt; tapCount = 0; }
    if (tapCount++ > 3) return;
    const v = Math.min(0.1, sp / 9000);
    noise({ type: "bandpass", f0: 1500 + Math.random()*2600, q: 3, a: 0.001, d: 0.028, vol: v });
  },
  slam() {                                               // 피날레: 압착기가 끝까지 내리찍는 소리
    if (!this.ready()) return;

    noise({ type: "highpass", f0: 3200, f1: 900, q: 0.8, a: 0.001, d: 0.22, vol: 0.30 });
    tone({ type: "triangle", f0: 120, f1: 38, a: 0.002, d: 0.7, vol: 0.24 });
  },
  boom() {                                               // 피날레: 전부 터지는 소리
    if (!this.ready()) return;
    noise({ type: "lowpass",  f0: 700, f1: 70, q: 0.7, a: 0.003, d: 0.9, vol: 0.55 });
    noise({ type: "bandpass", f0: 1200, f1: 6000, q: 0.8, a: 0.004, d: 0.5, vol: 0.34 });
    tone({ type: "sine", f0: 230, f1: 52, a: 0.002, d: 0.8, vol: 0.20 });
    for (let i = 0; i < 12; i++)
      noise({ at: 0.06 + i*0.05, type: "highpass", f0: 6500 - i*330, f1: 3000, q: 1, a: 0.001, d: 0.035, vol: 0.11 - i*0.008 });
  },
};

/* ---------- 압착기 ---------- */
const easeOut = t => 1 - (1-t)*(1-t);
// 주기 안에서의 구간. 누를 때는 처음부터 끝까지 같은 속도로 지긋이 밀고 들어간다(가속 없음).
// 벌릴 때만 빠르게 놓아 준다
const PHASE = { close: 0.55, hold: 0.62, open: 0.86 };   // 0.86 뒤는 벌린 채 대기
function pressHalfW() {
  const t = pressT;
  if (ended) return PRESS.closeHalf;
  if (t < PHASE.close) return PRESS.openHalf + (PRESS.closeHalf - PRESS.openHalf) * (t / PHASE.close);
  if (t < PHASE.hold)  return PRESS.closeHalf;
  if (t < PHASE.open)  return PRESS.closeHalf + (PRESS.openHalf - PRESS.closeHalf) * easeOut((t - PHASE.hold) / (PHASE.open - PHASE.hold));
  return PRESS.openHalf;
}
// 압착기를 이루는 네모들: 양옆 벽 + 위아래 귀퉁이 브래킷 네 개.
// 위아래 가운데는 뚫려 있어서 공이 그리로 드나든다. 다 닫히면 브래킷끼리 맞물려 한 덩어리가 된다
function brkLen(hw) { return PRESS.wall + (hw - PRESS.wall) * PRESS.brkFrac; }
function pressRects(hw) {
  const cx = ARENA.cx, cy = PRESS.cy, wl = PRESS.wall, hh = PRESS.halfH, bk = brkLen(hw);
  return [
    { x0: cx-hw,     x1: cx-hw+wl, y0: cy-hh, y1: cy+hh, side: -1 },
    { x0: cx+hw-wl,  x1: cx+hw,    y0: cy-hh, y1: cy+hh, side:  1 },
    { x0: cx-hw,     x1: cx-hw+bk, y0: cy-hh, y1: cy-hh+wl, side: -1 },
    { x0: cx+hw-bk,  x1: cx+hw,    y0: cy-hh, y1: cy-hh+wl, side:  1 },
    { x0: cx-hw,     x1: cx-hw+bk, y0: cy+hh-wl, y1: cy+hh, side: -1 },
    { x0: cx+hw-bk,  x1: cx+hw,    y0: cy+hh-wl, y1: cy+hh, side:  1 },
  ];
}

/* ---------- 물리 ---------- */
const FIXED = 1/120;
let grid = new Map();
function gridKey(cx, cy) { return cx * 100003 + cy; }

// 공은 압착기 입(가운데)으로 끌린다. 옆구리에 붙어 있으면 먼저 위아래로 돌아가게 겨냥점을 바꾼다
function seekTarget(b) {
  const cx = ARENA.cx, cy = PRESS.cy, hh = PRESS.halfH, wl = PRESS.wall, r = SETTINGS.ballR;
  const hw = pressHalfW(), inner = hw - wl, open = inner - brkLen(hw) + wl;
  if (Math.abs(b.x - cx) < inner && Math.abs(b.y - cy) < hh - wl) return null;   // 이미 입 안
  if (open < r*2.2) return null;                                                 // 닫히는 중이라 입구가 좁다
  if (Math.abs(b.x - cx) < open - r*0.4) return { x: cx, y: cy };                 // 뚫린 폭 안에 있으면 곧장 입으로
  const sy = b.y >= cy ? 1 : -1;
  return { x: cx, y: cy + sy*(hh + r*3.2) };                                     // 옆구리에 있으면 먼저 위아래로 돌아간다
}
// 지금 압착기 입 안에 들어와 있는 공 수
function mouthCount() {
  const hw = pressHalfW(), inner = hw - PRESS.wall, cx = ARENA.cx, cy = PRESS.cy, hh = PRESS.halfH;
  let n = 0;
  for (const b of balls) if (gt >= b.safe && Math.abs(b.x-cx) < inner && Math.abs(b.y-cy) < hh - PRESS.wall) n++;
  return n;
}
function step(dt, wallV) {
  const R = ARENA.R, hw = pressHalfW(), rects = pressRects(hw), r = SETTINGS.ballR;
  const gap = hw - PRESS.wall;                                  // 양쪽 벽 안쪽면 사이의 반폭

  for (const b of balls) {
    if (b.crush) {                                              // 압착판에 붙잡혀 버티는 중: 틈이 좁아지는 만큼 가운데로 모인다
      const k = 1 - Math.max(0, Math.min(1, (gap - burstGap()) / Math.max(1, touchGap() - burstGap())));
      b.x = ARENA.cx + (b.crush.x - ARENA.cx) * (1 - k); b.y = b.crush.y; b.vx = b.vy = 0;
      continue;
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.vx *= 0.9990; b.vy *= 0.9990;                             // 아주 약한 감쇠. 안 그러면 에너지가 계속 늘어난다
    const sp = Math.hypot(b.vx, b.vy);                          // 어딘가에 끼어 멈춰 버리면 아무 데로나 한 번 차 준다
    if (sp < 90) { b.slow = (b.slow || 0) + dt; if (b.slow > 0.7) { const a = Math.random()*Math.PI*2; b.vx += Math.cos(a)*240; b.vy += Math.sin(a)*240; b.slow = 0; } }
    else b.slow = 0;
    if (b.pop > 0) b.pop = Math.max(0, b.pop - dt*4);
    {                                                           // 공은 늘 압착기 입 쪽으로 방향을 튼다. 적을 땐 세게, 많아지면 약하게
      const t = seekTarget(b);
      if (t) {
        const dx = t.x - b.x, dy = t.y - b.y, d = Math.hypot(dx, dy) || 1;
        const n = balls.length, k = Math.min(1, dt * (n < 24 ? 5 : n < 120 ? 2.4 : 1.3)), want = 430;
        b.vx += (dx/d*want - b.vx) * k;
        b.vy += (dy/d*want - b.vy) * k;
      }
    }
  }

  // 원 벽
  for (const b of balls) {
    if (b.crush) continue;
    const dx = b.x - ARENA.cx, dy = b.y - ARENA.cy, d = Math.hypot(dx, dy), lim = R - r;
    if (d > lim) {
      const nx = dx/(d||1), ny = dy/(d||1);
      b.x = ARENA.cx + nx*lim; b.y = ARENA.cy + ny*lim;
      const vn = b.vx*nx + b.vy*ny;
      if (vn > 0) { b.vx -= (1+SETTINGS.wallBounce)*vn*nx; b.vy -= (1+SETTINGS.wallBounce)*vn*ny; if (vn > 300) SFX.tap(vn); }
    }
  }

  // 압착기 벽 (양옆 벽은 움직이므로 벽 속도를 얹어 준다)
  for (const b of balls) {
    if (b.crush) continue;                                      // 붙잡힌 공은 벽이 더 밀지 않는다
    for (const q of rects) {
      const cx = Math.max(q.x0, Math.min(b.x, q.x1)), cy = Math.max(q.y0, Math.min(b.y, q.y1));
      let dx = b.x - cx, dy = b.y - cy, d2 = dx*dx + dy*dy;
      if (d2 > r*r) continue;
      let nx, ny, pen;
      if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = dx/d; ny = dy/d; pen = r - d; }
      else {                                                    // 완전히 안에 들어간 경우: 가장 가까운 면으로 밀어낸다
        const l = b.x - q.x0, rr = q.x1 - b.x, t = b.y - q.y0, bo = q.y1 - b.y;
        const m = Math.min(l, rr, t, bo);
        nx = m === l ? -1 : m === rr ? 1 : 0; ny = m === t ? -1 : m === bo ? 1 : 0; pen = r + m;
      }
      b.x += nx*pen; b.y += ny*pen;
      const vn = b.vx*nx + b.vy*ny;
      if (vn < 0) { b.vx -= 1.7*vn*nx; b.vy -= 1.7*vn*ny; if (-vn > 300) SFX.tap(-vn); }
      if (q.side) b.vx += q.side * wallV * 0.35;                // 밀려 들어오는 벽이 공을 튕겨 낸다
    }
  }

  if (pressT < PHASE.hold && !ended) {                           // 미는 동안 입 안의 공은 붙잡혀 있다
    const hold = Math.pow(0.02, dt);
    for (const b of balls) {
      if (Math.abs(b.y - PRESS.cy) > PRESS.halfH - 3) continue;
      if (Math.abs(b.x - ARENA.cx) > gap + r) continue;
      b.vx *= hold; b.vy *= hold; b.slow = 0;
    }
  }

  // 공끼리: 격자로 이웃만 본다
  grid.clear();
  const cell = r*2;
  for (const b of balls) {
    const k = gridKey(Math.floor(b.x/cell), Math.floor(b.y/cell));
    let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(b);
  }
  const e = SETTINGS.restitution;
  for (const b of balls) {
    const gx = Math.floor(b.x/cell), gy = Math.floor(b.y/cell);
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const a = grid.get(gridKey(gx+ox, gy+oy)); if (!a) continue;
      for (const o of a) {
        if (o.id <= b.id) continue;
        const dx = o.x - b.x, dy = o.y - b.y, rs = r*2, d2 = dx*dx + dy*dy;
        if (d2 >= rs*rs || d2 < 1e-9) continue;
        const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
        const bf = b.crush ? 0 : o.crush ? 1 : 0.5, of = o.crush ? 0 : b.crush ? 1 : 0.5;
        const pen = rs - d;
        b.x -= nx*pen*bf; b.y -= ny*pen*bf; o.x += nx*pen*of; o.y += ny*pen*of;
        const vn = (o.vx - b.vx)*nx + (o.vy - b.vy)*ny;
        if (vn < 0) {
          const j = -(1+e) * vn * 0.5;
          b.vx -= j*nx; b.vy -= j*ny; o.vx += j*nx; o.vy += j*ny;
          if (-vn > 420) SFX.tap(-vn);
        }
      }
    }
  }

}

/* ---------- 무는 과정: 닿는다 → 버틴다 → 못 버티고 터진다 ---------- */
// 압착판이 공에 처음 닿는 간격과, 더 못 버티고 터지는 간격
function touchGap() { return SETTINGS.ballR * 1.2; }
function burstGap() { return SETTINGS.ballR * 0.45; }

// 압착판이 닿는 순간: 입 안의 공을 그 자리에 붙잡아 둔다. 이때부터 눌린 만큼 납작해진다
function beginCrush() {
  const r = SETTINGS.ballR, gap = Math.max(0, pressHalfW() - PRESS.wall);
  for (const b of balls) {
    if (b.crush || gt < b.safe) continue;                       // 막 태어난 공은 다음 번에 문다
    if (Math.abs(b.y - PRESS.cy) > PRESS.halfH - 3) continue;
    if (Math.abs(b.x - ARENA.cx) > gap + r) continue;
    b.crush = { x: b.x, y: b.y }; b.vx = b.vy = 0;
    crushing.push(b);
  }
  if (crushing.length) SFX.strain(crushing.length);
}
function releaseCrush() {                                       // 터지기 전에 압착기가 벌어지면 놓아 준다
  for (const b of crushing) b.crush = null;
  crushing.length = 0;
}
// 더 못 버티는 순간: 붙잡아 둔 공이 한꺼번에 터진다
function doCrush() {
  const out = crushing.filter(b => balls.includes(b));
  crushing.length = 0;
  if (!out.length) return;
  const set = new Set(out);
  balls = balls.filter(b => !set.has(b));
  for (const b of out) burst(b);
  SFX.pop(out.length);
  shake = Math.max(shake, 8 + Math.min(22, out.length*0.6));
  flash = Math.max(flash, Math.min(0.32, 0.06 + out.length*0.005));
}
// 지금 늘어난 정도. 닿는 순간 1 배에서 시작해 터지는 순간 SETTINGS.stretch 배가 된다.
// (틈 폭을 그대로 쓰면 터지는 간격 아래로는 안 변해서 슬라이더 절반이 죽는다)
function stretchNow() {
  const gap = Math.max(0, pressHalfW() - PRESS.wall);
  const t = Math.max(0, Math.min(1, (touchGap() - gap) / Math.max(1, touchGap() - burstGap())));
  return 1 + (SETTINGS.stretch - 1) * t;
}
// 세로로 늘어난 만큼 가로가 줄어든다 (부피를 얼추 지킨다)
function squashFor(sy) { return 1 / (sy * sy); }

// 한 개가 터지면서 두 개가 된다. 양옆으로 즙처럼 뿜어져 나간다
function burst(b) {
  const r = SETTINGS.ballR, hw = pressHalfW(), m = Math.max(2, Math.round(SETTINGS.mult));
  for (let i = 0; i < m; i++) {                                 // 눌린 자리에서 압착판 뒤쪽, 즉 양옆으로 튀어 나간다
    const dir = i % 2 ? 1 : -1, lane = Math.floor(i / 2);       // 한쪽에 여러 개면 뒤로·위아래로 벌려 놓는다
    const sp = 520 + Math.random()*420, a = (Math.random()-.5)*0.9;
    spawn(ARENA.cx + dir*(hw + r*1.15 + lane*r*0.9),
          b.y + (Math.random()-.5)*r*1.6 + (lane ? (lane % 2 ? 1 : -1) * Math.ceil(lane/2) * r*1.5 : 0),
          dir*Math.cos(a)*sp, Math.sin(a)*sp, 380);
    balls[balls.length-1].pop = 1;
  }
  for (let i = 0; i < 3*m; i++) {                               // 압착판 뒤쪽 양옆으로 뿜어져 나오는 즙 덩어리
    const dir = i % 2 ? 1 : -1;
    goo.push({ x: ARENA.cx + dir*(hw + 4), y: b.y + (Math.random()-.5)*PRESS.halfH*1.2,
               vx: dir*(420 + Math.random()*560), vy: (Math.random()-.5)*300,
               r: 20 + Math.random()*32, life: 1, color: b.color });
  }
  for (let i = 0; i < 4*m + 1; i++) {                           // 잘게 튀는 조각도 뒤쪽으로 치우친다
    const dir = i % 2 ? 1 : -1, a = (Math.random()-.5)*1.5, sp = 320 + Math.random()*880;
    particles.push({ x: ARENA.cx + dir*hw, y: b.y, vx: dir*Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1,
                     size: 3 + Math.random()*6, color: b.color, spin: Math.random()*Math.PI, spinV: (Math.random()-.5)*22 });
  }
}

/* ---------- 피날레 ---------- */
function finale() {
  ended = true; endedAt = gt; shake = 30; flash = 0.5; SFX.slam();
  setTimeout(() => {
    flash = 1; shake = 52; SFX.boom();
    for (const b of balls) {
      const a = Math.atan2(b.y - ARENA.cy, b.x - ARENA.cx) + (Math.random()-.5)*1.2, sp = 700 + Math.random()*1700;
      particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1.5,
                       size: SETTINGS.ballR*0.9, color: b.color, spin: Math.random()*Math.PI, spinV: (Math.random()-.5)*18 });
    }
    balls = [];
    confettiBurst(ARENA.cx, ARENA.cy);
    setTimeout(() => confettiBurst(ARENA.cx - 320, ARENA.cy + 120), 420);
    setTimeout(() => confettiBurst(ARENA.cx + 320, ARENA.cy + 120), 780);
  }, 520);
}
function confettiBurst(x, y) {
  for (let i = 0; i < 190; i++) {
    const ang = -Math.PI/2 + (Math.random()-.5)*2.5, sp = 900 + Math.random()*1400;
    confetti.push({ x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, w: 11 + Math.random()*15, h: 6 + Math.random()*9,
      rot: Math.random()*Math.PI, spin: (Math.random()-.5)*14, color: PALETTE[i % PALETTE.length], life: 4.2, sway: Math.random()*Math.PI*2 });
  }
}

/* ---------- 그리기 ---------- */
function ringSprite(R) {                                        // 원 테두리는 반지름이 바뀔 때만 다시 그린다
  if (ringCanvasR === Math.round(R) && ringCanvas) return ringCanvas;
  const pad = 26, S = Math.ceil((R + pad) * 2);
  const c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, S, S);
  grad.addColorStop(0, SETTINGS.ringColors[0]); grad.addColorStop(1, SETTINGS.ringColors[1]);
  g.strokeStyle = grad; g.lineWidth = 7; g.shadowColor = SETTINGS.ringColors[0]; g.shadowBlur = 22;
  g.beginPath(); g.arc(S/2, S/2, R, 0, Math.PI*2); g.stroke();
  ringCanvas = c; ringCanvasR = Math.round(R);
  return c;
}
function drawPress(hw) {
  const cx = ARENA.cx, cy = PRESS.cy, wl = PRESS.wall, hh = PRESS.halfH, bk = brkLen(hw);
  const metal = (x, y, w, h) => {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, "#9aa0a6"); g.addColorStop(0.35, "#c8ccd1"); g.addColorStop(0.55, "#7e848a"); g.addColorStop(1, "#5d6368");
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1.5; ctx.strokeRect(x+0.75, y+0.75, w-1.5, h-1.5);
  };
  metal(cx-hw, cy-hh, wl, hh*2);                                // 왼벽
  metal(cx+hw-wl, cy-hh, wl, hh*2);                             // 오른벽
  metal(cx-hw, cy-hh, bk, wl);      metal(cx+hw-bk, cy-hh, bk, wl);        // 위 귀퉁이 브래킷
  metal(cx-hw, cy+hh-wl, bk, wl);   metal(cx+hw-bk, cy+hh-wl, bk, wl);     // 아래 귀퉁이 브래킷
  if (hw > wl + PRESS.plate*1.2) {                              // 다 닫히면 압착판은 가려진다
    ctx.fillStyle = "#e0a93c";                                  // 안쪽 황동 압착판
    ctx.fillRect(cx-hw+wl, cy-hh+wl*0.4, PRESS.plate, hh*2 - wl*0.8);
    ctx.fillRect(cx+hw-wl-PRESS.plate, cy-hh+wl*0.4, PRESS.plate, hh*2 - wl*0.8);
  }
  ctx.fillStyle = "rgba(0,0,0,.35)";                            // 볼트
  for (const sx of [cx-hw+wl*0.5, cx+hw-wl*0.5]) for (const sy of [cy-hh*0.72, cy, cy+hh*0.72]) {
    ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, Math.PI*2); ctx.fill();
  }
}
function drawRail() {
  const y = PRESS.cy - RAIL_H/2;
  const g = ctx.createLinearGradient(0, y, 0, y + RAIL_H);
  g.addColorStop(0, "#8f949a"); g.addColorStop(0.4, "#cfd3d8"); g.addColorStop(0.62, "#787d83"); g.addColorStop(1, "#5a6065");

}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = SETTINGS.bgColor; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.4) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  const R = ARENA.R;
  if (R < 1240) { const sp = ringSprite(R); ctx.drawImage(sp, ARENA.cx - sp.width/2, ARENA.cy - sp.height/2); }

  const syNow = stretchNow(), sxNow = squashFor(syNow);
  const shiver = (1 - sxNow) * 3.2;                             // 눌릴수록 더 부들거린다
  const drawBall = (b, held) => {
    const sx = held ? sxNow : 1, sy = held ? syNow : 1;
    const jx = held ? (Math.random()-.5)*shiver : 0, jy = held ? (Math.random()-.5)*shiver : 0;
    if (ITEMS.length) {                                         // 프리셋 그림으로 그리기
      const sp = itemSprite(b.gen), k = 1 + b.pop*0.22, w = sp.width*k;
      ctx.drawImage(sp, b.x + jx - w*sx/2, b.y + jy - w*sy/2, w*sx, w*sy);
    } else {                                                    // 단색 공
      ctx.fillStyle = b.color;
      const rr = b.r * (1 + b.pop*0.22);
      ctx.beginPath(); ctx.ellipse(b.x + jx, b.y + jy, rr*sx, rr*sy, 0, 0, Math.PI*2); ctx.fill();
    }
  };
  for (const b of balls) if (!b.crush) drawBall(b, false);
  drawRail();
  drawPress(pressHalfW());
  for (const b of balls) if (b.crush) drawBall(b, true);        // 눌리는 중인 공은 압착판 위에 그려야 보인다

  for (const g of goo) {                                        // 눌려서 옆으로 뿜어져 나온 즙 (틀 위에 얹는다)
    ctx.globalAlpha = Math.min(1, g.life) * 0.92; ctx.fillStyle = g.color;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r * (0.4 + g.life*0.6), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of particles) {                                  // 튀는 조각
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin);
    const s = p.size * Math.min(1, p.life);
    ctx.fillRect(-s*0.5, -s*0.5, s, s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  for (const c of confetti) {
    ctx.save(); ctx.globalAlpha = Math.min(1, c.life); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h); ctx.restore();
  }
  ctx.globalAlpha = 1;

  if (flash > 0.01) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, flash)})`; ctx.fillRect(0, 0, W, H); }

  ctx.fillStyle = "#fff"; ctx.font = "900 92px -apple-system, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "top";
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 14;
  ctx.fillText(peak.toLocaleString(), W - 44, 52);
  ctx.shadowBlur = 0;
}

/* ---------- 루프 ---------- */
let last = performance.now(), acc = 0, lastHalf = PRESS.openHalf;
function loop(now) {
  const frame = Math.min(0.05, (now - last)/1000); last = now;
  if (!paused) {
    gt += frame * 1000; acc += frame;
    const before = pressT, gapBefore = lastHalf - PRESS.wall;
    if (!ended) {
      // 공이 버티는 동안에는 압착기가 느려진다. 그래야 납작해지는 게 눈에 보인다
      const squeezing = crushing.length > 0 && pressT < PHASE.close;
      const nt = pressT + frame*1000/SETTINGS.cycleMs * (squeezing ? 0.22 : 1);
      if (nt >= 1 && mouthCount() === 0) pressT = 0.96;                 // 물 게 없으면 벌린 채 기다린다
      else pressT = nt % 1;
    }
    if (pressT < before) cycleId++;                                     // 새 주기 시작
    if (before < 0.02 && pressT >= 0.02) SFX.servo(PHASE.close * SETTINGS.cycleMs / 1000);   // 미는 동안 내내
    const hwNow = pressHalfW(), gapNow = hwNow - PRESS.wall;
    if (!ended) {
      if (gapBefore > touchGap() && gapNow <= touchGap()) beginCrush();  // 압착판이 닿았다
      if (gapBefore > burstGap() && gapNow <= burstGap()) doCrush();     // 더 못 버틴다
      if (crushing.length && gapNow > touchGap() * 1.3) releaseCrush();  // 안 터지고 벌어졌으면 놓아 준다
    }
    if (before < PHASE.close && pressT >= PHASE.close) { SFX.clank(); shake = Math.max(shake, 7); }

    const wallV = Math.abs(hwNow - lastHalf) / Math.max(1e-4, frame); lastHalf = hwNow;
    while (acc >= FIXED) { step(FIXED, wallV); acc -= FIXED; }
    if (acc > 0.2) acc = 0;

    // 공이 늘어난 만큼 원이 커진다
    const need = Math.sqrt(balls.length * SETTINGS.ballR*SETTINGS.ballR / SETTINGS.pack);
    const target = Math.max(baseArenaR(), need);
    if (target > ARENA.R) ARENA.R += Math.min(target - ARENA.R, frame * 260);

    if (balls.length > peak) peak = balls.length;
    if (!ended) stage = Math.max(stage, stageNow());                    // 단계는 목표까지의 진행도를 따라간다
    if (!ended && balls.length >= SETTINGS.goal) finale();

    for (const g of goo) { g.x += g.vx*frame; g.y += g.vy*frame; g.vx *= 0.9; g.vy *= 0.9; g.life -= frame*2.2; }
    goo = goo.filter(g => g.life > 0);
    for (const p of particles) { p.x += p.vx*frame; p.y += p.vy*frame; p.vx *= 0.985; p.vy *= 0.985; p.life -= frame*0.95; p.spin += frame*(p.spinV||6); }
    particles = particles.filter(p => p.life > 0);
    for (const c of confetti) { c.sway += frame*3; c.x += (c.vx + Math.sin(c.sway)*90)*frame; c.y += c.vy*frame; c.vy += 1500*frame; c.vx *= 0.985; c.rot += c.spin*frame; c.life -= frame*0.5; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 120);
    shake *= Math.pow(0.0016, frame); if (shake < 0.4) shake = 0;
    flash -= frame * 1.8; if (flash < 0) flash = 0;
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 화면 맞춤 · UI ---------- */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W*s) + "px"; canvas.style.height = Math.floor(H*s) + "px";
}
addEventListener("resize", fit); fit();

const ui = document.getElementById("ui"), hint = document.getElementById("hint");
function setUI(show) { ui.classList.toggle("hidden", !show); hint.classList.toggle("hidden", !show); }
function toggleUI() { setUI(ui.classList.contains("hidden")); }
document.getElementById("btnHide").onclick = toggleUI;
if (params.get("ui") === "0") { setUI(false); document.getElementById("audioHint").classList.add("hidden"); }

/* ---------- 모드 바꾸기: 머지 게임 <-> 프레스 (파일은 둘이지만 UI 에서 한 번에 넘어간다) ---------- */
const modeSel = document.getElementById("modeSel");
modeSel.value = "press";
modeSel.onchange = () => {
  if (modeSel.value === "press") return;
  const q = new URLSearchParams();
  const p = (presetName || "none"); if (p) q.set("preset", p);
  if (params.get("ui") === "0") q.set("ui", "0");
  const s = q.toString();
  location.href = (modeSel.value === "press" ? "press.html" : "index.html") + (s ? "?" + s : "");
};

const sel = document.getElementById("presetSel");
if (typeof PRESETS !== "undefined") {
  sel.innerHTML = '<option value="none">단색 공</option>' + Object.keys(PRESETS).map(k => `<option value="${k}">${k}</option>`).join("");
  sel.value = presetName || "none";
  sel.onchange = () => {                                        // 프리셋을 바꾸면 그림을 새로 받고 처음부터
    presetName = PRESETS[sel.value] ? sel.value : null;
    ITEMS = presetName ? PRESETS[presetName].items : [];
    spriteCache.length = 0;
    setPaused(true); loadImages().then(() => { reset(); setPaused(false); });
  };
}
const btnPause = document.getElementById("btnPause");
function setPaused(p) { paused = p; btnPause.textContent = p ? "▶ 계속" : "⏸ 일시정지"; if (!p) last = performance.now(); }
btnPause.onclick = () => setPaused(!paused);
document.getElementById("btnReset").onclick = () => { reset(); setPaused(false); };

const openwIn = document.getElementById("openw"), openwVal = document.getElementById("openwVal");
const multIn = document.getElementById("mult"), multVal = document.getElementById("multVal");
const stretchIn = document.getElementById("stretch"), stretchVal = document.getElementById("stretchVal");
const cycleIn = document.getElementById("cycle"), cycleVal = document.getElementById("cycleVal");
const ballrIn = document.getElementById("ballr"), ballrVal = document.getElementById("ballrVal");
const goalIn  = document.getElementById("goal"),  goalVal  = document.getElementById("goalVal");
function syncUI() {
  openwIn.value = SETTINGS.openW;   openwVal.textContent = SETTINGS.openW;
  multIn.value = SETTINGS.mult;       multVal.textContent = "×" + SETTINGS.mult;
  stretchIn.value = SETTINGS.stretch; stretchVal.textContent = SETTINGS.stretch.toFixed(2) + "배";
  cycleIn.value = SETTINGS.cycleMs; cycleVal.textContent = SETTINGS.cycleMs + "ms";
  ballrIn.value = SETTINGS.ballR;   ballrVal.textContent = SETTINGS.ballR;
  goalIn.value  = SETTINGS.goal;    goalVal.textContent  = SETTINGS.goal;
}
multIn.oninput    = () => { SETTINGS.mult = +multIn.value; syncUI(); reset(); };   // 한 판 흐름이 통째로 달라져서 처음부터
stretchIn.oninput = () => { SETTINGS.stretch = +stretchIn.value; syncUI(); };   // 바로 반영된다 (다시 시작할 필요 없음)
openwIn.oninput = () => { SETTINGS.openW = +openwIn.value; PRESS.openHalf = SETTINGS.openW; syncUI(); reset(); };
cycleIn.oninput = () => { SETTINGS.cycleMs = +cycleIn.value; syncUI(); };
ballrIn.oninput = () => { SETTINGS.ballR = +ballrIn.value; spriteCache.length = 0; syncUI(); reset(); };   // 그림도 새 크기로 다시 굽는다
goalIn.oninput  = () => { SETTINGS.goal = +goalIn.value; syncUI(); };
syncUI();

let recorder = null, chunks = [];
let lastBlob = null, lastExt = "webm";
const btnRec = document.getElementById("btnRec");
function toggleRec() {
  if (recorder) { recorder.stop(); return; }
  initAudio();
  const stream = canvas.captureStream(60);
  if (recDest) for (const tr of recDest.stream.getAudioTracks()) stream.addTrack(tr);
  const mime = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12_000_000 } : undefined); }
  catch (e) { recorder = new MediaRecorder(stream); }
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onerror = e => { console.error("녹화 오류", e); };
  recorder.onstop = () => {
    const type = recorder.mimeType || mime || "video/webm";
    lastBlob = new Blob(chunks, { type }); lastExt = type.includes("mp4") ? "mp4" : "webm";
    recorder = null; btnRec.textContent = "● 녹화"; btnRec.classList.remove("rec");
    setUI(true); setPaused(true); openSavePanel();
  };
  reset(); setPaused(false);
  recorder.start(200);
  btnRec.textContent = "■ 녹화 중지"; btnRec.classList.add("rec");
  setUI(false);
  document.getElementById("audioHint").classList.add("hidden");
}
btnRec.onclick = toggleRec;

const savePanel = document.getElementById("savePanel"), savePreview = document.getElementById("savePreview"), saveMsg = document.getElementById("saveMsg"), btnSave = document.getElementById("btnSave");
function lastFile() { return new File([lastBlob], `press-${Date.now()}.${lastExt}`, { type: lastBlob.type }); }
function canShareVideo() { try { return !!(navigator.canShare && navigator.canShare({ files: [lastFile()] })); } catch (e) { return false; } }
function openSavePanel() {
  if (!lastBlob) return;
  savePreview.src = URL.createObjectURL(lastBlob); savePreview.play().catch(() => {});
  btnSave.textContent = canShareVideo() ? "📲 사진 앨범에 저장" : "⬇︎ 파일 내려받기";
  saveMsg.textContent = canShareVideo() ? '공유 시트가 뜨면 "비디오 저장"을 누르세요' : "내려받은 파일을 앨범으로 옮기면 됩니다";
  savePanel.classList.remove("hidden");
}
function closeSavePanel() { savePanel.classList.add("hidden"); savePreview.pause(); savePreview.removeAttribute("src"); }
btnSave.onclick = async () => {
  if (!lastBlob) return;
  if (canShareVideo()) { try { await navigator.share({ files: [lastFile()] }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(lastBlob); a.download = lastFile().name; document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("btnAgain").onclick = () => { closeSavePanel(); toggleRec(); };
document.getElementById("btnClose").onclick = closeSavePanel;

canvas.addEventListener("pointerdown", () => { if (ui.classList.contains("hidden")) setUI(true); });   // UI 숨김 중 화면 탭 → 다시 표시
addEventListener("keydown", e => {
  if (e.key === " " || e.key === "p" || e.key === "P") { e.preventDefault(); setPaused(!paused); }
  if (e.key === "h" || e.key === "H") toggleUI();
  if (e.key === "r" || e.key === "R") toggleRec();
  if (e.key === "Enter") { reset(); setPaused(false); }
});
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, initAudio, { passive: true }));

setPaused(true); requestAnimationFrame(loop);
loadImages().then(() => { reset(); setPaused(false); });
</script>
</body>
</html>
