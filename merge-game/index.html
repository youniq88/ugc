<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Merge Game (Reels)</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:-apple-system, "Noto Sans KR", sans-serif; }
  canvas { display:block; background:#000; }
  #ui { position:fixed; top:12px; right:12px; display:flex; gap:8px; z-index:10; flex-wrap:wrap; justify-content:flex-end; }
  #ui button, #ui select {
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:20px; padding:8px 14px; font-size:14px; cursor:pointer; backdrop-filter:blur(6px);
  }
  #ui button.rec { background:#e0245e; border-color:#e0245e; }
  #ui button.on { background:rgba(255,255,255,.35); }
  #hint { position:fixed; bottom:10px; left:0; right:0; text-align:center; color:rgba(255,255,255,.35); font-size:12px; z-index:10; pointer-events:none; }
  #audioHint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3); border-radius:30px; padding:12px 22px; font-size:15px; z-index:20; pointer-events:none; backdrop-filter:blur(6px); }
  #savePanel { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; backdrop-filter:blur(8px); }
  #savePanel video { width:min(52vw, 260px); aspect-ratio:9/16; border-radius:16px; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #savePanel button { border:0; border-radius:28px; padding:16px 28px; font-size:18px; font-weight:700; cursor:pointer; }
  #btnSave { background:#3d7bff; color:#fff; min-width:240px; }
  #btnAgain { background:rgba(255,255,255,.15); color:#fff; }
  #btnClose { background:transparent; color:rgba(255,255,255,.6); font-size:14px; font-weight:400; }
  #saveMsg { color:rgba(255,255,255,.7); font-size:13px; text-align:center; max-width:80vw; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <select id="presetSel"></select>
  <button id="btnPause">⏸ 일시정지</button>
  <button id="btnReset">다시 시작</button>
  <button id="btnRec">● 녹화</button>
  <button id="btnHide">UI 숨기기</button>
</div>
<div id="savePanel" class="hidden">
  <video id="savePreview" playsinline muted autoplay loop></video>
  <button id="btnSave">📲 사진 앨범에 저장</button>
  <div id="saveMsg">아이폰: 공유 시트가 뜨면 "비디오 저장"을 누르세요</div>
  <button id="btnAgain">● 다시 녹화</button>
  <button id="btnClose">닫기</button>
</div>
<div id="audioHint">🔈 화면을 한 번 탭하면 소리가 켜집니다</div>
<div id="hint">스페이스/P: 일시정지 · H: UI 숨기기/보이기 · R: 녹화(시작 시 UI 자동 숨김) · Enter: 다시 시작 · URL ?preset=이름 &ui=0</div>

<script>
/* ============================================================
   ▼▼▼ 여기만 수정하면 됩니다: 단계별 요소 설정 ▼▼▼
   - 각 프리셋은 낮은 단계 → 높은 단계 순서의 배열입니다. 같은 단계 두 개가 닿으면 다음 단계가 됩니다.
   - 한 프리셋의 그래픽은 한 디자인 키트에서만 가져와 스타일을 통일합니다.
     kit: "fluent" = Microsoft Fluent Emoji 3D (MIT 라이선스, github.com/microsoft/fluentui-emoji)
          img 값은 assets/ 아래 경로 ("폴더/3D/파일명_3d.png")
   - 프리셋 속성 sound: 효과음 테마 ("space" 신비로운 / "juicy" 쥬시한 / "crystal" 유리·보석)
   - 프리셋 속성 physics: { restitution: 반발계수, wobble: 1 } 로 프리셋별 물리 덮어쓰기 (젤리는 0.88 + 찌그러짐)
   - 항목 속성:
       r      : 반지름(px, 1080x1920 캔버스 기준) - 단계가 올라갈수록 크게
       img    : 키트 안의 이미지 경로 (kit 와 함께 사용)
       image  : 직접 지정하는 이미지 URL (img 대신)
       scale  : 이미지를 반지름 대비 얼마나 크게 그릴지 (기본 1.12, PNG 여백 보정)
       glow   : 주변에 퍼지는 빛 색상
       shape / colors : 코드로 그리는 도형 (이미지 없이 쓸 때. pearl teardrop emerald cushion brilliant star moon mars earth saturn jupiter sun blackhole galaxy sphere)
       emoji  : 이모지로 그릴 때
       noSpin : true 면 물리 회전을 그리지 않음 (블랙홀처럼 기울면 어색한 것)
   ============================================================ */
const KITS = {
  // 같은 파일을 두 곳에서 순서대로 시도 (앞이 실패하면 뒤)
  fluent: [
    "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/",
    "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/",
  ],
  // 젤리 프리셋 전용: 단색 구미 젤리 9종 (AI 렌더링 후 배경 제거, 512px 투명 PNG, CORS 허용 CDN)
  gummy: [
    "https://d2ol7oe51mr4n9.cloudfront.net/user_3EqJlrQps4r0GBhzHSZNDkCfWAY/",
  ],
};
const PRESETS = {
  planets: {   // 9단계: 초승달 → 그믐달 → 보름달 → 지구 → 토성 → 태양 → 혜성 → 빛나는 별 → 블랙홀
    kit: "fluent", sound: "space",
    items: [
      { r:36,  img:"Crescent moon/3D/crescent_moon_3d.png",                           glow:"#ffd98a" },
      { r:46,  img:"New moon/3D/new_moon_3d.png",                                     glow:"#b9a6ff" },
      { r:58,  img:"Full moon/3D/full_moon_3d.png",                                   glow:"#ffe3a0" },
      { r:72,  img:"Globe showing europe-africa/3D/globe_showing_europe-africa_3d.png", glow:"#5ab4ff" },
      { r:90,  img:"Ringed planet/3D/ringed_planet_3d.png",                           glow:"#ffb64d" },
      { r:110, img:"Sun/3D/sun_3d.png",                                               glow:"#ffb300" },
      { r:134, img:"Comet/3D/comet_3d.png",                                           glow:"#8fd3ff" },
      { r:160, img:"Glowing star/3D/glowing_star_3d.png",                             glow:"#fff3a0" },
      { r:190, shape:"blackhole", glow:"#ff9a3d", noSpin:true },                      // 인터스텔라 스타일 블랙홀 (코드 드로잉)
    ],
  },
  gems: {      // 9단계: 진주 → 에메랄드 → 사파이어 → 자수정 → 루비 → 주황 다이아 → 파랑 다이아 → 젬스톤 → 왕관
    kit: "fluent", sound: "crystal",
    items: [
      { r:36,  img:"White circle/3D/white_circle_3d.png",                 glow:"#ffffff", scale:1.02 },
      { r:46,  img:"Green circle/3D/green_circle_3d.png",                 glow:"#2eff7a", scale:1.02 },
      { r:58,  img:"Blue circle/3D/blue_circle_3d.png",                   glow:"#3d7bff", scale:1.02 },
      { r:72,  img:"Purple circle/3D/purple_circle_3d.png",               glow:"#c04dff", scale:1.02 },
      { r:90,  img:"Red circle/3D/red_circle_3d.png",                     glow:"#ff2a4a", scale:1.02 },
      { r:110, img:"Large orange diamond/3D/large_orange_diamond_3d.png", glow:"#ff9d2e" },
      { r:134, img:"Large blue diamond/3D/large_blue_diamond_3d.png",     glow:"#4da3ff" },
      { r:160, img:"Gem stone/3D/gem_stone_3d.png",                       glow:"#9be7ff" },
      { r:190, img:"Crown/3D/crown_3d.png",                               glow:"#ffd54f" },
    ],
  },
  jelly: {     // 9단계 단색 구미 젤리: 콩 → 물방울 → 하트 → 별 → 링 → 큐브 → 꽃 → 물고기 → 곰. 탄력 3배 체감(반발 0.88 + 찌그러짐)
    kit: "gummy", sound: "juicy",
    physics: { restitution: 0.88, wobble: 1 },
    items: [
      { r:36,  img:"af9ad4ee-077f-4af2-80ae-bdc09776af0d.png", glow:"#ff3b3b", scale:1.08 },   // 빨강 콩
      { r:46,  img:"38f0d532-76d7-417b-8f33-40cb892ca7ba.png", glow:"#ff8a1f", scale:1.08 },   // 주황 물방울
      { r:58,  img:"463dc062-15f2-42cf-88b7-6c5aa18b2bec.png", glow:"#ffd21f", scale:1.08 },   // 노랑 하트
      { r:72,  img:"4c035574-5c83-4a72-a921-73ccd3e68f9d.png", glow:"#5ee05a", scale:1.08 },   // 초록 별
      { r:90,  img:"c2236dae-5d1a-4d07-bc51-3df65afb2bda.png", glow:"#2fd6c8", scale:1.08 },   // 민트 링
      { r:110, img:"99193df4-7464-4d54-8bb5-eeefd61a992c.png", glow:"#3b8bff", scale:1.08 },   // 파랑 큐브
      { r:134, img:"0f3ae334-93f7-474b-a5c6-baac63dc9923.png", glow:"#9b5bff", scale:1.08 },   // 보라 꽃
      { r:160, img:"19c1aa3d-ca53-4a66-af46-048aea168193.png", glow:"#ff5fb8", scale:1.08 },   // 분홍 물고기
      { r:190, img:"3b1fb27b-c1f5-42c9-a594-c24ccc2df71d.png", glow:"#ffffff", scale:1.08 },   // 하양 곰
    ],
  },
  fruits: {    // 9단계: 체리 → 딸기 → 포도 → 귤 → 사과 → 복숭아 → 파인애플 → 멜론 → 수박
    kit: "fluent", sound: "juicy",
    items: [
      { r:36,  img:"Cherries/3D/cherries_3d.png",     glow:"#ff5a7a" },
      { r:46,  img:"Strawberry/3D/strawberry_3d.png", glow:"#ff4d6d" },
      { r:58,  img:"Grapes/3D/grapes_3d.png",         glow:"#b04dff" },
      { r:72,  img:"Tangerine/3D/tangerine_3d.png",   glow:"#ff9d2e" },
      { r:90,  img:"Red apple/3D/red_apple_3d.png",   glow:"#ff3b3b" },
      { r:110, img:"Peach/3D/peach_3d.png",           glow:"#ffb08a" },
      { r:134, img:"Pineapple/3D/pineapple_3d.png",   glow:"#ffd54f" },
      { r:160, img:"Melon/3D/melon_3d.png",           glow:"#b8ff7a" },
      { r:190, img:"Watermelon/3D/watermelon_3d.png", glow:"#ff5a5a" },
    ],
  },
};

/* ---------- 게임 동작 설정 ---------- */
const SETTINGS = {
  preset: "planets",     // 기본 프리셋 (URL ?preset=gems 로 바꿀 수 있음)
  tubeSpeed: 620,        // 관 안에서 줄지어 내려오는 속도 (px/s)
  tubeGap: 40,           // 관 안에서 요소 사이 빈 간격 (px) - 낙하 간격은 여기서 자동 계산
  dropTiers: 3,          // 처음 몇 단계까지 랜덤으로 떨어뜨릴지
  maxTierVanish: true,   // 마지막 단계끼리 합치면 사라지게 (false면 그대로 유지)
  gravity: 2600,         // 중력 (px/s²)
  restitution: 0.55,     // 튕김 정도 (0~1) - 벽·요소끼리 통통 튀는 정도
  gameOverHoldMs: 2500,  // 넘쳤을 때 몇 ms 뒤에 자동 재시작
  showScore: true,
  showLegend: false,     // 하단 진행표(단계 나열) 표시 - 기본 숨김
  stars: true,           // 배경에 은은한 별 점
  soundVolume: 0.8,      // 효과음 크기 (0~1, 0이면 무음)
  bgColor: "#000000",
  ringColors: ["#c9b6ff", "#ffd0e0"], // 용기 테두리 그라데이션
};
/* ▲▲▲ 설정 끝 ▲▲▲ */

/* ================= 이하 엔진 ================= */
const W = 1080, H = 1920;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = W; canvas.height = H;

// 용기 기하: 원형 그릇 + 위쪽 관
const BOWL = { cx: W/2, cy: 1130, R: 490 };
const TUBE = { half: 85, top: 0 };
BOWL.neckY = BOWL.cy - Math.sqrt(BOWL.R*BOWL.R - TUBE.half*TUBE.half);
const DANGER_Y = BOWL.neckY - 40;   // 이 선 위에서 멈춰있으면 게임오버

const params = new URLSearchParams(location.search);
let presetName = params.get("preset") in PRESETS ? params.get("preset") : SETTINGS.preset;
let TIERS = PRESETS[presetName].items;

let bodies = [], particles = [], popups = [], rings = [], confetti = [];
let ended = false, endedAt = 0;          // 마지막 단계 도달 후 정지 상태
let score = 0, nextTier = 0, lastDrop = 0, overSince = 0, flash = 0, shake = 0;
let gt = 0;                 // 게임 시계(ms) - 일시정지 중엔 멈춤
let paused = false;
let uid = 0;
const imgCache = {};

function imageCandidates(t) {
  if (t.image) return [t.image];
  if (t.img) { const kit = KITS[PRESETS[presetName].kit] || []; return kit.map(b => b + t.img.split("/").map(encodeURIComponent).join("/")); }
  return [];
}
// 이미지를 후보 URL 순서대로 시도해서 캐시에 넣음. 모두 끝나면(성공/실패 무관) resolve
function loadImages() {
  const jobs = [];
  for (const t of TIERS) {
    const cands = imageCandidates(t); if (!cands.length) continue;
    const key = cands[0]; t._imgKey = key;
    if (imgCache[key]) continue;
    jobs.push(new Promise(res => {
      let i = 0;
      const tryNext = () => {
        if (i >= cands.length) { imgCache[key] = null; res(); return; }
        const im = new Image(); im.crossOrigin = "anonymous";
        im.onload = () => { imgCache[key] = im; t._sprite = null; res(); };
        im.onerror = () => { i++; tryNext(); };
        im.src = cands[i];
      };
      tryNext();
    }));
  }
  return Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 6000))]);
}
function reset() {
  bodies = []; particles = []; popups = []; rings = []; confetti = []; score = 0; overSince = 0; flash = 0; ended = false;
  nextTier = randTier(); lastDrop = gt;
}
function randTier() {
  // 관(TUBE)을 통과할 수 있는 크기의 단계만 떨어뜨림
  let n = Math.min(SETTINGS.dropTiers, TIERS.length);
  while (n > 1 && TIERS[n-1].r >= TUBE.half - 4) n--;
  return Math.floor(Math.random() * n);
}
function spawn(tier, x, y, vx=0, vy=0, inTube=false) {
  bodies.push({ id: uid++, tier, r: TIERS[tier].r, x, y, vx, vy, inTube, born: gt, rot: 0, av: 0 });
}
// 관 안 줄 간격: 떨어뜨리는 단계 중 가장 큰 지름 + tubeGap
function dropSpacing() {
  let maxR = 0;
  for (let i = 0; i < Math.min(SETTINGS.dropTiers, TIERS.length); i++) if (TIERS[i].r < TUBE.half - 4) maxR = Math.max(maxR, TIERS[i].r);
  return maxR * 2 + SETTINGS.tubeGap;
}
function dropIntervalMs() { return dropSpacing() / SETTINGS.tubeSpeed * 1000; }
function drop() {
  const t = nextTier, r = TIERS[t].r;
  spawn(t, BOWL.cx, -r - 4, 0, SETTINGS.tubeSpeed, true);   // 화면 위에서 등장
  nextTier = randTier(); lastDrop = gt;
}

/* ---------- 사운드 (Web Audio 합성, 외부 파일 없음) ---------- */
let actx = null, master = null, recDest = null, verb = null, noiseBuf = null;
let lastHitAt = 0, hitCount = 0;
function initAudio() {
  if (actx) { if (actx.state !== "running") actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = SETTINGS.soundVolume;
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 6;
  master.connect(comp); comp.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); comp.connect(recDest);   // 녹화용
  verb = actx.createGain(); verb.gain.value = 0.35;
  const dl = actx.createDelay(1); dl.delayTime.value = 0.23;
  const fb = actx.createGain(); fb.gain.value = 0.45;
  const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2800;
  verb.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  actx.resume();
  document.getElementById("audioHint").classList.add("hidden");
}
function tone({ type="sine", f0, f1, a=0.005, d=0.3, vol=0.2, verbAmt=0, detune=0 }) {
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.detune.value = detune;
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  o.connect(g); g.connect(master); if (verbAmt) { const vg = actx.createGain(); vg.gain.value = verbAmt; g.connect(vg); vg.connect(verb); }
  o.start(t); o.stop(t + a + d + 0.05);
}
function noise({ type="bandpass", f0, f1, q=1, a=0.002, d=0.1, vol=0.2, verbAmt=0 }) {
  const t = actx.currentTime, src = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f0, t);
  if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  src.connect(fl); fl.connect(g); g.connect(master); if (verbAmt) { const vg = actx.createGain(); vg.gain.value = verbAmt; g.connect(vg); vg.connect(verb); }
  src.start(t); src.stop(t + a + d + 0.05);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const noteHz = (base, idx) => base * Math.pow(2, PENTA[Math.max(0, Math.min(PENTA.length-1, idx))] / 12);
const THEMES = {
  space: {
    hit(tier, k) {
      const f = noteHz(196, TIERS.length - 1 - tier);
      tone({ f0: f, a: 0.01, d: 0.7, vol: 0.10 + 0.15*k, verbAmt: 0.8 });
      tone({ f0: f*2.005, a: 0.01, d: 0.45, vol: 0.04 + 0.05*k, verbAmt: 0.6 });
      tone({ type: "triangle", f0: f*0.5, a: 0.02, d: 0.5, vol: 0.05*k, verbAmt: 0.5 });
    },
    merge(tier) {
      const base = noteHz(262, tier);
      [1, 1.5, 2].forEach((m, i) => setTimeout(() => {
        tone({ f0: base*m, a: 0.02, d: 1.6, vol: 0.18, verbAmt: 1 });
        tone({ f0: base*m*2.01, a: 0.02, d: 1.0, vol: 0.06, verbAmt: 1 });
      }, i*90));
      noise({ type: "highpass", f0: 1200, f1: 6000, a: 0.05, d: 0.9, vol: 0.05, verbAmt: 1 });
    },
  },
  juicy: {
    hit(tier, k) {
      const f = 420 - tier*28;
      tone({ f0: f, f1: f*0.35, a: 0.003, d: 0.11, vol: 0.12 + 0.22*k });
      noise({ f0: 1900, f1: 700, q: 1.4, d: 0.07, vol: 0.06 + 0.16*k });
    },

    if (ended) {                                                     // 마지막 요소 도달: 더 이상 떨어지지 않고 3초 뒤 물리도 정지
      if (gt - endedAt < 3000) { while (acc >= FIXED) { step(FIXED); acc -= FIXED; } } else acc = 0;
    } else if (!overSince) {
      if (gt - lastDrop > dropIntervalMs()) drop();
      while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
      const transitMs = (BOWL.neckY + 40) / SETTINGS.tubeSpeed * 1000;
      const stuck = bodies.some(b => b.y - b.r < DANGER_Y && gt - b.born > transitMs + 900);
      if (stuck) { overSince = gt; shake = 20; }
    } else if (gt - overSince > SETTINGS.gameOverHoldMs) reset();
    for (const c of confetti) { c.vy += 1400*frame; c.vx *= 0.985; c.vy *= 0.99; c.sway += frame*5; c.x += (c.vx + Math.sin(c.sway)*90)*frame; c.y += c.vy*frame; c.rot += c.spin*frame; c.life -= frame; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 40);
    for (const p of particles) { p.x += p.vx*frame; p.y += p.vy*frame; p.vy += 1500*frame; p.life -= frame*1.6; p.spin += frame*6; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) p.t += frame * 1.2;
    popups = popups.filter(p => p.t < 1);
    for (const rg of rings) rg.t += frame * 2.2;
    rings = rings.filter(rg => rg.t < 1);
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 화면 맞춤 ---------- */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W*s) + "px"; canvas.style.height = Math.floor(H*s) + "px";
}
addEventListener("resize", fit); fit();

/* ---------- UI / 일시정지 / 녹화 ---------- */
const ui = document.getElementById("ui"), hint = document.getElementById("hint");
const sel = document.getElementById("presetSel");
for (const k of Object.keys(PRESETS)) { const o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o); }
sel.value = presetName;
sel.onchange = () => { presetName = sel.value; TIERS = PRESETS[presetName].items; setPaused(true); loadImages().then(() => { reset(); setPaused(false); }); };
document.getElementById("btnReset").onclick = reset;
const btnPause = document.getElementById("btnPause");
function setPaused(v) { paused = v; btnPause.textContent = paused ? "▶ 재개" : "⏸ 일시정지"; btnPause.classList.toggle("on", paused); last = performance.now(); }
btnPause.onclick = () => setPaused(!paused);
function setUI(show) { ui.classList.toggle("hidden", !show); hint.classList.toggle("hidden", !show); }
function toggleUI() { setUI(ui.classList.contains("hidden")); }
document.getElementById("btnHide").onclick = toggleUI;
if (params.get("ui") === "0") setUI(false);

let recorder = null, chunks = [];
const btnRec = document.getElementById("btnRec");
function toggleRec() {
  if (recorder) { recorder.stop(); return; }
  initAudio();
  const stream = canvas.captureStream(60);
  if (recDest) for (const tr of recDest.stream.getAudioTracks()) stream.addTrack(tr);
  // 아이폰 사파리는 mp4, 크롬/데스크톱은 webm 으로 녹화됨 (지원되는 첫 형식 선택)
  const mime = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12_000_000 } : undefined); }
  catch (e) { recorder = new MediaRecorder(stream); }
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onerror = e => { console.error("녹화 오류", e); };
  recorder.onstop = () => {
    const type = recorder.mimeType || mime || "video/webm";
    lastBlob = new Blob(chunks, { type }); lastExt = type.includes("mp4") ? "mp4" : "webm";
    recorder = null; btnRec.textContent = "● 녹화"; btnRec.classList.remove("rec");
    setUI(true);                                       // 녹화 끝나면 UI 다시 표시
    setPaused(true);
    openSavePanel();
  };
  reset(); setPaused(false);                          // 녹화 시작 = 처음부터
  recorder.start(200);
  btnRec.textContent = "■ 녹화 중지"; btnRec.classList.add("rec");
  setUI(false);                                        // 녹화 시작하면 UI 자동 숨김
  document.getElementById("audioHint").classList.add("hidden");
}
btnRec.onclick = toggleRec;

/* ---------- 저장: 아이폰은 공유 시트 → "비디오 저장"으로 앨범에 저장 / 그 외는 파일 다운로드 ---------- */
let lastBlob = null, lastExt = "webm";
const savePanel = document.getElementById("savePanel"), savePreview = document.getElementById("savePreview"), saveMsg = document.getElementById("saveMsg"), btnSave = document.getElementById("btnSave");
function lastFile() { return new File([lastBlob], `merge-${presetName}-${Date.now()}.${lastExt}`, { type: lastBlob.type }); }
function canShareVideo() { try { return !!(navigator.canShare && navigator.canShare({ files: [lastFile()] })); } catch (e) { return false; } }
function openSavePanel() {
  if (!lastBlob) return;
  savePreview.src = URL.createObjectURL(lastBlob); savePreview.play().catch(() => {});
  const share = canShareVideo();
  btnSave.textContent = share ? "📲 사진 앨범에 저장" : "⬇️ 영상 파일 다운로드";
  saveMsg.textContent = share ? "공유 시트가 뜨면 \"비디오 저장\"을 누르세요" : "이 브라우저는 앨범 직접 저장을 지원하지 않아 파일로 내려받습니다";
  savePanel.classList.remove("hidden");
}
function closeSavePanel() { savePanel.classList.add("hidden"); savePreview.pause(); setPaused(false); }
btnSave.onclick = async () => {                      // 반드시 탭(사용자 제스처) 안에서 호출해야 iOS 공유 시트가 열림
  if (!lastBlob) return;
  if (canShareVideo()) {
    try { await navigator.share({ files: [lastFile()], title: "Merge game" }); saveMsg.textContent = "저장 완료! 사진 앱에서 확인하세요"; return; }
    catch (e) { if (e && e.name === "AbortError") return; saveMsg.textContent = "공유 실패: " + (e && e.message ? e.message : e); }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(lastBlob); a.download = lastFile().name; document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("btnAgain").onclick = () => { closeSavePanel(); toggleRec(); };
document.getElementById("btnClose").onclick = closeSavePanel;
canvas.addEventListener("pointerdown", () => { if (ui.classList.contains("hidden")) setUI(true); });   // UI 숨김 중 화면 탭 → 다시 표시
addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") toggleUI();
  if (e.key === "r" || e.key === "R") toggleRec();
  if (e.key === "p" || e.key === "P" || e.key === " ") { e.preventDefault(); setPaused(!paused); }
  if (e.key === "Enter") reset();
});

paused = true; reset(); requestAnimationFrame(loop);
loadImages().then(() => { reset(); setPaused(false); });   // 키트 이미지가 준비되면 시작
</script>
</body>
</html>
