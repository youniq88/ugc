<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Merge Game (Reels)</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:-apple-system, "Noto Sans KR", sans-serif; }
  canvas { display:block; background:#000; }
  #ui { position:fixed; top:12px; right:12px; display:flex; gap:8px; z-index:10; flex-wrap:wrap; justify-content:flex-end; }
  #ui button, #ui select {
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:20px; padding:8px 14px; font-size:14px; cursor:pointer; backdrop-filter:blur(6px);
  }
  #ui button.rec { background:#e0245e; border-color:#e0245e; }
  #ui button.on { background:rgba(255,255,255,.35); }
  #ui label { display:flex; align-items:center; gap:8px; color:#fff; font-size:14px; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:6px 14px; backdrop-filter:blur(6px); }
  #ui input[type=range] { width:110px; accent-color:#ffd0e0; }
  #hint { position:fixed; bottom:10px; left:0; right:0; text-align:center; color:rgba(255,255,255,.35); font-size:12px; z-index:10; pointer-events:none; }
  #audioHint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3); border-radius:30px; padding:12px 22px; font-size:15px; z-index:20; pointer-events:none; backdrop-filter:blur(6px); }
  #savePanel { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; backdrop-filter:blur(8px); }
  #savePanel video { width:min(52vw, 260px); aspect-ratio:9/16; border-radius:16px; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #savePanel button { border:0; border-radius:28px; padding:16px 28px; font-size:18px; font-weight:700; cursor:pointer; }
  #btnSave { background:#3d7bff; color:#fff; min-width:240px; }
  #btnAgain { background:rgba(255,255,255,.15); color:#fff; }
  #btnClose { background:transparent; color:rgba(255,255,255,.6); font-size:14px; font-weight:400; }
  #saveMsg { color:rgba(255,255,255,.7); font-size:13px; text-align:center; max-width:80vw; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <select id="presetSel"></select>
  <button id="btnPause">⏸ 일시정지</button>
  <button id="btnReset">다시 시작</button>
  <button id="btnRec">● 녹화</button>
  <label title="탄성: 벽과 요소끼리 튀는 정도">탄성 <input id="bounce" type="range" min="0" max="1" step="0.01"><span id="bounceVal"></span></label>
  <button id="btnHide">UI 숨기기</button>
</div>
<div id="savePanel" class="hidden">
  <video id="savePreview" playsinline muted autoplay loop></video>
  <button id="btnSave">📲 사진 앨범에 저장</button>
  <div id="saveMsg">아이폰: 공유 시트가 뜨면 "비디오 저장"을 누르세요</div>
  <button id="btnAgain">● 다시 녹화</button>
  <button id="btnClose">닫기</button>
</div>
<div id="audioHint">🔈 화면을 한 번 탭하면 소리가 켜집니다</div>
<div id="hint">스페이스/P: 일시정지 · H: UI 숨기기/보이기 · R: 녹화(시작 시 UI 자동 숨김) · Enter: 다시 시작 · URL ?preset=이름 &bounce=0.7 &ui=0</div>

   - 한 프리셋의 그래픽은 한 디자인 키트에서만 가져와 스타일을 통일합니다.

   - 프리셋 속성 physics: { restitution: 반발계수, wobble: 1 } 로 프리셋별 물리 덮어쓰기 (젤리는 0.88 + 찌그러짐)
   - 항목 속성:
       r      : 반지름(px, 1080x1920 캔버스 기준) - 단계가 올라갈수록 크게

       noSpin : true 면 물리 회전을 그리지 않음 (블랙홀처럼 기울면 어색한 것)

function imageCandidates(t) {
  if (t.image) return [t.image];
  if (t.img) { const kit = KITS[PRESETS[presetName].kit] || []; return kit.map(b => b + t.img.split("/").map(encodeURIComponent).join("/")); }
  return [];
}
// 이미지를 후보 URL 순서대로 시도해서 캐시에 넣음. 모두 끝나면(성공/실패 무관) resolve
function loadImages() {
  const jobs = [];
  for (const t of TIERS) {
    const cands = imageCandidates(t); if (!cands.length) continue;
    const key = cands[0]; t._imgKey = key;
    if (imgCache[key]) continue;
    jobs.push(new Promise(res => {
      let i = 0;
      const tryNext = () => {
        if (i >= cands.length) { imgCache[key] = null; res(); return; }
        const im = new Image(); im.crossOrigin = "anonymous";
        im.onload = () => { imgCache[key] = im; t._sprite = null; res(); };
        im.onerror = () => { i++; tryNext(); };
        im.src = cands[i];
      };
      tryNext();
    }));
  }
  return Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 6000))]);
}
function reset() {
  bodies = []; particles = []; popups = []; rings = []; confetti = []; bolts = []; fxQueue = []; drifts = []; score = 0; overSince = 0; flash = 0; ended = false;
  finaleBusy = false; meteor = null; ashFall = false; ashDim = 0; ashDimTo = 0; arrows = [];
  moon = null; nightDim = 0; nightDimTo = 0;
  nextTier = randTier(); lastDrop = gt; melodyIdx = 0;   // 멜로디도 처음부터
}
function randTier() {
  // 관(TUBE)을 통과할 수 있는 크기의 단계만 떨어뜨림
  let n = Math.min(SETTINGS.dropTiers, TIERS.length);
  while (n > 1 && TIERS[n-1].r >= TUBE.half - 4) n--;
  return Math.floor(Math.random() * n);
}
function spawn(tier, x, y, vx=0, vy=0, inTube=false) {
  bodies.push({ id: uid++, tier, r: TIERS[tier].r, x, y, vx, vy, inTube, born: gt, rot: 0, av: 0 });
}
// 관 안 줄 간격: 떨어뜨리는 단계 중 가장 큰 지름 + tubeGap
function dropSpacing() {
  let maxR = 0;
  for (let i = 0; i < Math.min(SETTINGS.dropTiers, TIERS.length); i++) if (TIERS[i].r < TUBE.half - 4) maxR = Math.max(maxR, TIERS[i].r);
  return maxR * 2 + SETTINGS.tubeGap;
}
function dropIntervalMs() { return dropSpacing() / SETTINGS.tubeSpeed * 1000; }
function drop() {
  const t = nextTier, r = TIERS[t].r;
  spawn(t, BOWL.cx, -r - 4, 0, SETTINGS.tubeSpeed, true);   // 화면 위에서 등장
  nextTier = randTier(); lastDrop = gt;
}

    ctx.save(); ctx.rotate(t.noSpin ? 0 : (b.rot || 0));                                 // 본체: 물리 회전
    if (ash == null) ctx.drawImage(sp.base, -h, -h);
    else {                                                                               // 화산재에 덮여 회색으로 굳는 중
      ctx.globalAlpha = 1 - ash; ctx.drawImage(sp.base, -h, -h);
      ctx.globalAlpha = ash;     ctx.drawImage(ashenSprite(t), -h, -h);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (ash != null) ctx.globalAlpha = 1 - ash;
    else if (sl != null) ctx.globalAlpha = 1 - sl*sl;
    else if (hw != null) ctx.globalAlpha = 1 - Math.pow(Math.max(0, hw - 0.35) / 0.65, 2);
    ctx.drawImage(sp.light, -h, -h);                                                     // 조명: 고정
    ctx.restore(); return;
  }

  const heat = Math.sin(Math.min(1, k)*Math.PI), fade = Math.max(0, 1 - k*k), char = Math.min(1, k*1.6);
  const gr = b.r * (1.5 + 0.6*heat);

  ctx.save(); ctx.rotate(t.noSpin ? 0 : (b.rot || 0));
  ctx.globalAlpha = fade * (1 - char); ctx.drawImage(sp.base, -h, -h);
  ctx.globalAlpha = fade * char;       ctx.drawImage(charredSprite(t), -h, -h);
  ctx.restore();
  ctx.globalAlpha = fade * (1 - char); ctx.drawImage(sp.light, -h, -h);

}
function drawLegend() {
  const n = TIERS.length, y = 1800, pad = 40, slot = (W - pad*2) / n;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const t = TIERS[i], x = pad + slot*(i+.5), sp = sprite(t);
    const r = 20 + i * (24 / Math.max(1, n-1)), k = r / t.r, w = sp.S*k;
    ctx.drawImage(sp.base, x - w/2, y - w/2, w, w); ctx.drawImage(sp.light, x - w/2, y - w/2, w, w);
    if (i < n-1) { ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.font = "26px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("›", x + slot/2, y); }

function render() {
  if (!bgCanvas) buildBackground();

  ctx.drawImage(bgCanvas, 0, 0);
  if (shake > 0) { ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= 0.85; if (shake < .5) shake = 0; }
  ctx.save();
  containerPathOn(ctx, 4); ctx.clip();
  for (const b of bodies) drawBody(b);
  for (const rg of rings) {                                     // 합체 충격파
    if (rg.t < 0) continue;
    ctx.globalAlpha = (1 - rg.t) * 0.8; ctx.strokeStyle = rg.color; ctx.lineWidth = 6 * (1 - rg.t) + 1;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r0 * (0.6 + rg.t*2.2), 0, Math.PI*2); ctx.stroke();
  }
  for (const p of particles) {                                  // 반짝이 파티클
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); const s = p.size * p.life;
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.quadraticCurveTo(0,0,s,0); ctx.quadraticCurveTo(0,0,0,s); ctx.quadraticCurveTo(0,0,-s,0); ctx.quadraticCurveTo(0,0,0,-s); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawContainer();
  for (const c of confetti) {                                   // 축하 색종이 (화면 전체)
    ctx.save(); ctx.globalAlpha = Math.min(1, c.life); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h); ctx.restore();
  }
  for (const d of drifts) {                                     // 재와 기포
    ctx.save(); ctx.globalAlpha = Math.min(1, d.life) * 0.85; ctx.fillStyle = d.color;
    ctx.translate(d.x, d.y);
    if (d.h) { ctx.rotate(d.rot); ctx.fillRect(-d.w/2, -d.h/2, d.w, d.h); }              // 재: 작은 조각
    else { ctx.beginPath(); ctx.arc(0, 0, d.w/2, 0, Math.PI*2); ctx.fill();              // 기포: 동그라미
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t; ctx.fillStyle = "#fff"; ctx.shadowColor = p.color; ctx.shadowBlur = 20;
    ctx.font = `900 ${Math.round(52 + p.t*30)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(p.text, p.x, p.y - p.t*80);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.restore();

  if (SETTINGS.showScore) {
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.font = "700 44px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(255,255,255,.6)"; ctx.shadowBlur = 12; ctx.fillText(score.toLocaleString(), W - 50, 110); ctx.shadowBlur = 0;
  }
  if (SETTINGS.showLegend) drawLegend();
  if (ashDim > 0.01) { ctx.fillStyle = `rgba(96,92,86,${ashDim*0.5})`; ctx.fillRect(0,0,W,H); }   // 잿빛으로 내려앉는 화면
  if (nightDim > 0.01) { ctx.fillStyle = `rgba(22,34,78,${nightDim*0.24})`; ctx.fillRect(0,0,W,H); }   // 푸른 밤으로 내려앉는 화면 (인형이 묻히지 않게 옅게)
  if (moon) {                                                   // 떠오르는 보름달 (밤 색보다 위에 그려서 환하게)
    const u = 1 - Math.pow(1 - moon.t, 3), R = 360 * (0.8 + 0.2*u);
    const mx = W*0.72, my = 700 - 430*u;
    ctx.save(); ctx.globalAlpha = Math.min(1, moon.t*1.6);
    ctx.drawImage(moonSprite(), mx - R, my - R, R*2, R*2);
    ctx.restore();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash*.6})`; ctx.fillRect(0,0,W,H); flash -= 0.06; }
  if (meteor) {                                                 // 떨어지는 운석: 불꼬리 + 달아오른 머리
    const u = meteor.t, mx = meteor.x0 + (meteor.x1-meteor.x0)*u, my = meteor.y0 + (meteor.y1-meteor.y0)*u;
    const dx = meteor.x1-meteor.x0, dy = meteor.y1-meteor.y0, len = Math.hypot(dx, dy) || 1;
    const tail = 520, tx = mx - dx/len*tail, ty = my - dy/len*tail;
    const tg = ctx.createLinearGradient(mx, my, tx, ty);
    tg.addColorStop(0, "rgba(255,240,200,0.95)"); tg.addColorStop(0.35, "rgba(255,140,40,0.5)"); tg.addColorStop(1, "rgba(255,80,0,0)");
    ctx.save(); ctx.lineCap = "round";
    ctx.strokeStyle = tg; ctx.lineWidth = 54; ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.strokeStyle = tg; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(tx, ty); ctx.stroke();
    const hg = ctx.createRadialGradient(mx, my, 0, mx, my, 90);
    hg.addColorStop(0, "rgba(255,255,240,1)"); hg.addColorStop(0.4, "rgba(255,170,60,0.8)"); hg.addColorStop(1, "rgba(255,90,0,0)");
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(mx, my, 90, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#5a4030"; ctx.beginPath(); ctx.arc(mx, my, 26, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  for (const bt of bolts) {                                     // 번개: 흰 섬광보다도 위에 그림 (바깥 광 → 본선 → 흰 심)
    if (bt.t < 0) continue;
    const a = Math.max(0, 1 - bt.t) * (0.6 + Math.random()*0.4);
    ctx.save(); ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); bt.pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
    ctx.strokeStyle = bt.color;                                 // 굵기가 다른 선을 겹쳐 빛나 보이게 (그림자 블러는 무거움)
    ctx.globalAlpha = a*0.14; ctx.lineWidth = bt.w*5.5; ctx.stroke();
    ctx.globalAlpha = a*0.34; ctx.lineWidth = bt.w*2.4; ctx.stroke();
    ctx.globalAlpha = a;      ctx.lineWidth = bt.w; ctx.stroke();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(1.5, bt.w*0.32); ctx.stroke();
    ctx.restore();
  }
  for (const a of arrows) {                                     // 화살: 빛나는 궤적 + 나무 살대, 쇠촉, 붉은 깃
    const u = Math.min(1, a.t), hx = a.x0 + (a.x1-a.x0)*u, hy = a.y0 + (a.y1-a.y0)*u;
    const dx = a.x1-a.x0, dy = a.y1-a.y0, len = Math.hypot(dx, dy) || 1, ux = dx/len, uy = dy/len, al = Math.max(0, a.life);
    ctx.save(); ctx.lineCap = "round";
    ctx.strokeStyle = "#ffd24a"; ctx.lineWidth = 10; ctx.globalAlpha = al * 0.25;
    ctx.beginPath(); ctx.moveTo(a.x0, a.y0); ctx.lineTo(hx, hy); ctx.stroke();               // 궤적
    ctx.globalAlpha = al;
    const L = Math.min(150, u*len), tx = hx - ux*L, ty = hy - uy*L;
    ctx.strokeStyle = "#e8d6a8"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();   // 살대
    ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + ux*28, ty + uy*28); ctx.stroke();   // 깃
    ctx.fillStyle = "#3a3a3a"; ctx.beginPath();                                                 // 쇠촉
    ctx.moveTo(hx + ux*18, hy + uy*18); ctx.lineTo(hx - uy*11, hy + ux*11); ctx.lineTo(hx + uy*11, hy - ux*11); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  if (overSince) {
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff"; ctx.font = "900 110px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "#fff"; ctx.shadowBlur = 30; ctx.fillText("GAME OVER", W/2, H/2); ctx.shadowBlur = 0;
    ctx.font = "600 44px sans-serif"; ctx.fillText(`SCORE ${score.toLocaleString()}`, W/2, H/2 + 100);
  }
}

/* ---------- 루프 ---------- */
let last = performance.now(), acc = 0;
const FIXED = 1/240;
function loop(now) {
  const frame = Math.min(0.05, (now - last)/1000); last = now;
  if (!paused) {
    gt += frame * 1000; acc += frame;
    if (ended) {                                                     // 마지막 요소 도달: 더 이상 떨어지지 않고 3초 뒤 물리도 정지
      if (gt - endedAt < 3000) { while (acc >= FIXED) { step(FIXED); acc -= FIXED; } } else acc = 0;
    } else if (!overSince) {
      if (gt - lastDrop > dropIntervalMs()) drop();
      while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
      const transitMs = (BOWL.neckY + 40) / SETTINGS.tubeSpeed * 1000;
      const stuck = bodies.some(b => b.y - b.r < DANGER_Y && gt - b.born > transitMs + 900);
      if (stuck) { overSince = gt; shake = 20; }
    } else if (gt - overSince > SETTINGS.gameOverHoldMs) reset();
    fxQueue = fxQueue.filter(e => { if (gt >= e.at) { e.fn(); return false; } return true; });   // 예약해 둔 피날레 연출
    for (const bt of bolts) bt.t += frame * 6;                   // 번개는 0.17초쯤 번쩍이고 사라짐
    bolts = bolts.filter(bt => bt.t < 1);
    if (meteor) {                                                // 운석이 하늘에서 내려오는 중
      meteor.t += frame / meteor.dur;
      if (meteor.t >= 1) meteorImpact(meteor.x1, meteor.y1);
    }
    for (const a of arrows) {                                    // 날아가는 화살
      if (a.t < 1) { a.t += frame / a.dur; if (a.t >= 1) { a.t = 1; arrowHit(a); } }
      else a.life -= frame * 3;                                  // 꽂힌 뒤엔 궤적만 잠깐 남았다 사라짐
    }
    arrows = arrows.filter(a => a.life > 0);
    if (finaleBusy) {                                            // 피날레에 걸린 요소들의 진행
      let gone = false;
      for (const b of bodies) {
        if (b.aim != null) b.aim += frame * 1.3;                 // 시위를 당기는 중
        if (b.cry != null) b.cry += frame * 0.55;                // 늑대가 우는 중
        if (b.howl != null) {                                    // 따라 울고 달빛이 되어 사라짐
          b.howl += frame * 0.75;
          if (b.howl > 0.4 && Math.random() < 0.35) moonMote(b);
          if (b.howl >= 1) { b.dead = true; gone = true; }
        }
        if (b.slain != null) {                                   // 화살에 맞아 쓰러짐
          b.slain += frame * 2.2;
          if (b.slain >= 1) { b.dead = true; gone = true; }
        }
        if (b.burn != null) {                                    // 불타 사라짐
          b.burn += frame * 1.6;
          if (Math.random() < 0.4) ember(b);
          if (b.burn >= 1) { b.dead = true; gone = true; }
        } else if (b.ash != null && b.ash < 1) {                 // 화산재에 굳음 (사라지지는 않음)
          b.ash = Math.min(1, b.ash + frame * 2.2);
        } else if (b.crush != null) {                            // 수압에 찌그러지다 터짐
          b.crush += frame * 3.2;
          if (b.crush >= 1) { implodePop(b); b.dead = true; gone = true; }
        }
        if (b.fly) {                                             // 살아남은 한 마리가 날아오름
          b.y -= 300 * frame; b.x += Math.sin(gt/260) * 70 * frame; b.rot = Math.sin(gt/240) * 0.18;
          if (b.y < -300) { b.dead = true; gone = true; }
        }
      }
      if (gone) bodies = bodies.filter(b => !b.dead);
    }
    if (ashFall) for (let i = 0; i < 3; i++) ashFlake();          // 재가 계속 쏟아짐
    ashDim += (ashDimTo - ashDim) * Math.min(1, frame * 1.2);
    if (moon && moon.t < 1) moon.t = Math.min(1, moon.t + frame / 1.4);   // 달이 떠오르는 중
    nightDim += (nightDimTo - nightDim) * Math.min(1, frame * 0.9);
    for (const d of drifts) {                                    // 재·기포처럼 천천히 흘러가는 조각들
      d.vy += d.g * frame; d.sway += frame * 2.4;
      d.x += (d.vx + Math.sin(d.sway) * d.swing) * frame; d.y += d.vy * frame;
      d.rot += d.spin * frame; d.life -= frame;
    }
    drifts = drifts.filter(d => d.life > 0 && d.y < H + 80 && d.y > -120);
    for (const c of confetti) { c.vy += 1400*frame; c.vx *= 0.985; c.vy *= 0.99; c.sway += frame*5; c.x += (c.vx + Math.sin(c.sway)*90)*frame; c.y += c.vy*frame; c.rot += c.spin*frame; c.life -= frame; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 40);
    for (const p of particles) { p.x += p.vx*frame; p.y += p.vy*frame; p.vy += 1500*frame; p.life -= frame*1.6; p.spin += frame*6; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) p.t += frame * 1.2;
    popups = popups.filter(p => p.t < 1);
    for (const rg of rings) rg.t += frame * 2.2;
    rings = rings.filter(rg => rg.t < 1);
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 화면 맞춤 ---------- */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W*s) + "px"; canvas.style.height = Math.floor(H*s) + "px";
}
addEventListener("resize", fit); fit();

/* ---------- UI / 일시정지 / 녹화 ---------- */
const ui = document.getElementById("ui"), hint = document.getElementById("hint");
const sel = document.getElementById("presetSel");
for (const k of Object.keys(PRESETS)) { const o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o); }
sel.value = presetName;
sel.onchange = () => { presetName = sel.value; TIERS = PRESETS[presetName].items; bounceOverride = null; syncBounceUI(); setPaused(true); loadImages().then(() => { reset(); setPaused(false); }); };
const bounceIn = document.getElementById("bounce"), bounceVal = document.getElementById("bounceVal");
function syncBounceUI() { bounceIn.value = bounce(); bounceVal.textContent = bounce().toFixed(2); }
bounceIn.oninput = () => { bounceOverride = parseFloat(bounceIn.value); syncBounceUI(); };   // 슬라이더는 즉시 반영 (프리셋을 바꾸면 그 프리셋 기본값으로 돌아감)
syncBounceUI();

const btnPause = document.getElementById("btnPause");
function setPaused(v) { paused = v; btnPause.textContent = paused ? "▶ 재개" : "⏸ 일시정지"; btnPause.classList.toggle("on", paused); last = performance.now(); }
btnPause.onclick = () => setPaused(!paused);
function setUI(show) { ui.classList.toggle("hidden", !show); hint.classList.toggle("hidden", !show); }
function toggleUI() { setUI(ui.classList.contains("hidden")); }
document.getElementById("btnHide").onclick = toggleUI;

let recorder = null, chunks = [];
const btnRec = document.getElementById("btnRec");
function toggleRec() {
  if (recorder) { recorder.stop(); return; }
  initAudio();
  const stream = canvas.captureStream(60);
  if (recDest) for (const tr of recDest.stream.getAudioTracks()) stream.addTrack(tr);
  // 아이폰 사파리는 mp4, 크롬/데스크톱은 webm 으로 녹화됨 (지원되는 첫 형식 선택)
  const mime = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12_000_000 } : undefined); }
  catch (e) { recorder = new MediaRecorder(stream); }
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onerror = e => { console.error("녹화 오류", e); };
  recorder.onstop = () => {
    const type = recorder.mimeType || mime || "video/webm";
    lastBlob = new Blob(chunks, { type }); lastExt = type.includes("mp4") ? "mp4" : "webm";
    recorder = null; btnRec.textContent = "● 녹화"; btnRec.classList.remove("rec");
    setUI(true);                                       // 녹화 끝나면 UI 다시 표시
    setPaused(true);
    openSavePanel();
  };
  reset(); setPaused(false);                          // 녹화 시작 = 처음부터
  recorder.start(200);
  btnRec.textContent = "■ 녹화 중지"; btnRec.classList.add("rec");
  setUI(false);                                        // 녹화 시작하면 UI 자동 숨김
  document.getElementById("audioHint").classList.add("hidden");
}
btnRec.onclick = toggleRec;

/* ---------- 저장: 아이폰은 공유 시트 → "비디오 저장"으로 앨범에 저장 / 그 외는 파일 다운로드 ---------- */
let lastBlob = null, lastExt = "webm";
const savePanel = document.getElementById("savePanel"), savePreview = document.getElementById("savePreview"), saveMsg = document.getElementById("saveMsg"), btnSave = document.getElementById("btnSave");
function lastFile() { return new File([lastBlob], `merge-${presetName}-${Date.now()}.${lastExt}`, { type: lastBlob.type }); }
function canShareVideo() { try { return !!(navigator.canShare && navigator.canShare({ files: [lastFile()] })); } catch (e) { return false; } }
function openSavePanel() {
  if (!lastBlob) return;
  savePreview.src = URL.createObjectURL(lastBlob); savePreview.play().catch(() => {});
  const share = canShareVideo();
  btnSave.textContent = share ? "📲 사진 앨범에 저장" : "⬇️ 영상 파일 다운로드";
  saveMsg.textContent = share ? "공유 시트가 뜨면 \"비디오 저장\"을 누르세요" : "이 브라우저는 앨범 직접 저장을 지원하지 않아 파일로 내려받습니다";
  savePanel.classList.remove("hidden");
}
function closeSavePanel() { savePanel.classList.add("hidden"); savePreview.pause(); setPaused(false); }
btnSave.onclick = async () => {                      // 반드시 탭(사용자 제스처) 안에서 호출해야 iOS 공유 시트가 열림
  if (!lastBlob) return;
  if (canShareVideo()) {
    try { await navigator.share({ files: [lastFile()], title: "Merge game" }); saveMsg.textContent = "저장 완료! 사진 앱에서 확인하세요"; return; }
    catch (e) { if (e && e.name === "AbortError") return; saveMsg.textContent = "공유 실패: " + (e && e.message ? e.message : e); }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(lastBlob); a.download = lastFile().name; document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("btnAgain").onclick = () => { closeSavePanel(); toggleRec(); };
document.getElementById("btnClose").onclick = closeSavePanel;
canvas.addEventListener("pointerdown", () => { if (ui.classList.contains("hidden")) setUI(true); });   // UI 숨김 중 화면 탭 → 다시 표시
addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") toggleUI();
  if (e.key === "r" || e.key === "R") toggleRec();
  if (e.key === "p" || e.key === "P" || e.key === " ") { e.preventDefault(); setPaused(!paused); }
  if (e.key === "Enter") reset();
});

paused = true; reset(); requestAnimationFrame(loop);
loadImages().then(() => { reset(); setPaused(false); });   // 키트 이미지가 준비되면 시작
</script>
</body>
</html>
